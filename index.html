<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212E">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>C7 | المبيعات والمحاسبة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17212E; --ink2:#223044; --ink3:#31435C;
  --paper:#EDF0F3; --card:#FFFFFF; --line:#D6DCE3; --line2:#E6EAEE;
  --text:#1A232F; --muted:#627084;
  --amber:#F0A202; --amber-d:#B97A00;
  --teal:#11826B; --red:#BF3B2F; --blue:#2C69A8;
  --r:10px;
  font-family:"IBM Plex Sans Arabic", Tahoma, "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body,#app{height:100%;margin:0}
body{background:var(--paper);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1{font-size:1.45rem;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 .6rem;font-weight:600}
h3{font-size:1.05rem;margin:0;font-weight:600}
small{font-size:.78em;color:var(--muted);font-weight:500}
.num,td.n,output{font-variant-numeric:tabular-nums}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.5rem .95rem;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:var(--ink3);color:#E8EDF3}
.btn.sm{padding:.3rem .7rem;font-size:.87rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue);padding:0;font-weight:500}
.fld{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.fld>span{font-size:.82rem;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;background:#fff;min-width:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink3);outline:none;box-shadow:0 0 0 3px rgba(240,162,2,.25)}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.92rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.empty.sm{padding:1.2rem .5rem;font-size:.9rem}
.badge{display:inline-block;padding:.05rem .5rem;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--line2);color:var(--muted)}
.badge.ok{background:#DDF1EB;color:var(--teal)}
.badge.bad{background:#F7E0DD;color:var(--red)}
.badge.warn{background:#FCEFD2;color:var(--amber-d)}
.pos-v{color:var(--teal)} .neg-v{color:var(--red)}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-weight:600;color:var(--muted);font-size:.8rem;text-align:start;padding:.6rem .75rem;border-bottom:1px solid var(--line);background:#F7F9FA;white-space:nowrap}
td{padding:.55rem .75rem;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#F7F9FA}
td.n,th.n{text-align:end;white-space:nowrap}
tfoot td{font-weight:700;background:#F7F9FA;border-top:1px solid var(--line)}
td .acts{display:flex;gap:.35rem;justify-content:flex-end;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(18,26,36,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.md{background:var(--card);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 1rem);display:flex;flex-direction:column;animation:pop .16s ease-out}
.md.wide{width:min(860px,100%)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line2)}
.md-b{padding:1.1rem 1.2rem;overflow:auto;display:flex;flex-direction:column;gap:.85rem}
.md-f{padding:.85rem 1.2rem;border-top:1px solid var(--line2);display:flex;gap:.5rem;justify-content:flex-start;flex-wrap:wrap}
.x{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--muted);padding:0 .3rem}
#toast{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--red)}
#toast.ok{background:var(--teal)}

/* auth screens */
.auth{min-height:100%;display:grid;place-items:center;padding:1.5rem;background:var(--ink)}
.auth-card{background:var(--card);border-radius:16px;width:min(400px,100%);padding:2rem 1.6rem;display:flex;flex-direction:column;gap:1rem}
.mark{display:flex;align-items:center;gap:.7rem}
.mark b{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--ink);color:var(--amber);font-size:1.25rem;font-weight:700;letter-spacing:.02em}
.mark div{line-height:1.3}
.auth .hint{font-size:.85rem;color:var(--muted);background:var(--paper);border-radius:8px;padding:.6rem .8rem}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}

/* POS */
.pos{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:auto 1fr}
.pos-top{grid-column:1/-1;min-width:0;background:var(--ink);color:#fff;display:flex;align-items:center;gap:1rem;padding:.55rem 1rem}
.brand{font-weight:700;color:var(--amber);font-size:1.1rem;white-space:nowrap}
.brand span{color:#C8D2DE;font-weight:500;font-size:.9rem;margin-inline-start:.35rem}
#pos-head{display:flex;gap:.45rem;align-items:center;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.who{color:#C8D2DE;font-size:.88rem;white-space:nowrap;padding-inline:.3rem}
.net{font-size:.78rem;padding:.12rem .55rem;border-radius:99px;background:#1D5E50;color:#BFF0E2;white-space:nowrap}
.net.off{background:#6B3A12;color:#FFD9A8}
.catalog{display:flex;flex-direction:column;min-height:0;padding:1rem;gap:.8rem}
.search{display:flex;gap:.5rem}
.search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;background:#fff;font-size:1rem;min-width:0}
.search input:focus{outline:none;border-color:var(--ink3);box-shadow:0 0 0 3px rgba(240,162,2,.25)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.3rem .85rem;white-space:nowrap;font-size:.88rem}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;overflow:auto;align-content:start;padding-bottom:1rem}
.pc{text-align:start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.7rem .75rem;display:flex;flex-direction:column;gap:.2rem;min-height:104px;transition:transform .08s}
.pc:hover{border-color:var(--ink3)}
.pc:active{transform:scale(.97)}
.pc .pn{font-weight:600;font-size:.93rem;line-height:1.35;flex:1}
.pc .pp{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.pc .ps{font-size:.76rem;color:var(--teal)}
.pc .ps.low{color:var(--amber-d)}
.pc.out{opacity:.55}
.pc.out .ps{color:var(--red)}
.cart{background:var(--ink2);color:#E8EDF3;display:flex;flex-direction:column;min-height:0}
.cart-h{display:flex;gap:.5rem;padding:.8rem .9rem;border-bottom:1px solid var(--ink3)}
.cust{flex:1;text-align:start;background:var(--ink);border:1px dashed var(--ink3);color:#C8D2DE;border-radius:8px;padding:.5rem .7rem;font-size:.9rem}
.cust b{color:#fff}
.cart-close{display:none}
.lines{flex:1;overflow:auto;padding:.3rem .9rem}
.ln{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--ink3)}
.ln-n{font-size:.92rem;font-weight:500;line-height:1.35}
.ln-n small{display:block;color:#9FB0C3}
.ln-n small.edit{text-decoration:underline dotted;cursor:pointer}
.qty{display:flex;align-items:center;background:var(--ink);border-radius:8px}
.qty button{background:none;border:0;color:#fff;width:30px;height:30px;font-size:1.05rem}
.qty .qv{width:auto;min-width:28px;font-variant-numeric:tabular-nums;font-size:.92rem}
.ln-t{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px;text-align:end}
.rm{background:none;border:0;color:#8395AA;font-size:1.2rem;padding:0 .2rem}
.cart .empty{color:#9FB0C3}
.cart-f{padding:.7rem .9rem;display:flex;flex-direction:column;gap:.55rem;border-top:1px solid var(--ink3)}
.cart-f .fld>span{color:#9FB0C3}
.cart-f input{background:var(--ink);border:1px solid var(--ink3);color:#fff;border-radius:8px;padding:.45rem .6rem;width:100%;min-width:0}
.cart-f input:focus{outline:none;border-color:var(--amber)}
.drow{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:end}
.dt{background:var(--ink);border:1px solid var(--ink3);color:var(--amber);border-radius:8px;height:36px;min-width:52px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);border-radius:9px;padding:3px;gap:3px}
.seg button{background:none;border:0;color:#9FB0C3;border-radius:7px;padding:.42rem 0;font-size:.9rem}
.seg button.on{background:var(--ink3);color:#fff;font-weight:600}
#sum{padding:.3rem .9rem .2rem}
#sum .row{display:flex;justify-content:space-between;font-size:.9rem;color:#C8D2DE;padding:.12rem 0}
#sum .row b{font-weight:600;font-variant-numeric:tabular-nums;color:#fff}
#sum .row.neg b{color:#FFB4A8}
.led{display:flex;align-items:baseline;justify-content:space-between;background:#0E151E;border-radius:10px;padding:.5rem .8rem;margin:.45rem 0;border:1px solid #2A3A50}
.led span{color:#8C7A4E;font-size:.9rem}
.led output{color:var(--amber);font-size:2.3rem;font-weight:700;letter-spacing:.02em;line-height:1.1;text-shadow:0 0 18px rgba(240,162,2,.28)}
.warn{color:#FFD08A;font-size:.85rem;padding:.15rem 0}
.pay{margin:.3rem .9rem calc(.9rem + env(safe-area-inset-bottom,0px));background:var(--amber);color:var(--ink);border:0;border-radius:10px;padding:.85rem;font-size:1.1rem;font-weight:700}
.pay:disabled{opacity:.5}
.mbar{display:none}

/* receipt preview */
.rc-prev{background:var(--paper);border-radius:10px;padding:1rem;display:flex;justify-content:center}
.rc-prev .rcpt{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* admin */
.adm{min-height:100%;display:grid;grid-template-columns:230px 1fr}
.side{background:var(--ink);color:#C8D2DE;display:flex;flex-direction:column;padding:1rem .7rem;gap:.2rem;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.side .brand{padding:.2rem .6rem 1rem}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{background:none;border:0;color:#C8D2DE;text-align:start;padding:.52rem .75rem;border-radius:8px;font-size:.94rem;white-space:nowrap}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff;font-weight:600;box-shadow:inset -3px 0 0 var(--amber)}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:.45rem;padding:.8rem .3rem 0;border-top:1px solid var(--ink2)}
.side-f .who{padding:0 .3rem}
main{padding:1.4rem 1.6rem 3rem;min-width:0;display:flex;flex-direction:column;gap:1rem}
#sec-head{display:flex;flex-direction:column;gap:.9rem}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.filters{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap}
.filters .fld{width:auto;min-width:140px}
#sec-body{display:flex;flex-direction:column;gap:1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.today{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--ink);color:#fff;border-radius:14px;overflow:hidden}
.today>div{padding:1.1rem 1.2rem;border-inline-start:1px solid var(--ink3)}
.today>div:first-child{border:0}
.today .k{font-size:.82rem;color:#9FB0C3}
.today .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.today>div:first-child .v{font-size:2.3rem;color:var(--amber)}
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:.45rem 0;border-bottom:1px dashed var(--line)}
.ledger td:last-child{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.ledger tr.tot td{border-bottom:0;border-top:2px solid var(--text);font-size:1.08rem;font-weight:700}
.ledger tr.sub td{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.stat{border:1px solid var(--line2);border-radius:8px;padding:.6rem .7rem}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.list-s{display:flex;flex-direction:column}
.list-s>div{display:flex;justify-content:space-between;gap:.5rem;padding:.42rem 0;border-bottom:1px solid var(--line2);font-size:.92rem}
.list-s>div:last-child{border:0}
.plines{display:flex;flex-direction:column;gap:.5rem}
.pl{display:grid;grid-template-columns:2fr .8fr 1fr auto;gap:.5rem;align-items:end}
.note{font-size:.86rem;color:var(--muted);background:var(--paper);border-radius:8px;padding:.6rem .8rem}
.scan-v{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}

#print-area{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
details>summary{cursor:pointer;font-weight:600}
.pl.il{grid-template-columns:2.2fr .7fr 1fr auto}
.mark img{width:46px;height:46px;border-radius:10px;background:#fff;object-fit:contain;padding:3px;border:1px solid var(--line)}
.brand img{width:26px;height:26px;vertical-align:-7px;margin-inline-end:.45rem;background:#fff;border-radius:6px;padding:2px}
.ipaper{width:100%;max-width:640px;margin:0 auto;background:#f5f2ec;color:#232323;padding:40px 44px;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.5;text-align:right}
.ipn{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ip-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #232323;padding-bottom:16px;margin-bottom:20px;gap:1rem}
.ip-brand{display:flex;align-items:center;gap:12px}
.ip-brand img{width:52px;height:52px;object-fit:contain}
.ip-head h1{font-size:21px;margin:0 0 4px}
.ip-sub{font-size:11.5px;color:#6b6b6b}
.ip-doc{text-align:left;white-space:nowrap}
.ip-no{font-size:20px;font-weight:600}
.ip-meta{display:flex;justify-content:space-between;margin-bottom:20px;font-size:13px;gap:1rem}
.ip-meta b{display:block;font-size:11px;color:#6b6b6b;font-weight:500;margin-bottom:2px}
.ip-cats{margin-bottom:14px}
.ip-cats span{display:inline-block;font-size:11px;border:1px solid #232323;border-radius:20px;padding:2px 10px;margin-left:6px}
.ip-maint{background:#eee9dc;border:1px solid #ddd6c4;border-radius:4px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;line-height:1.9}
.ip-mt{font-weight:700;font-size:12px;margin-bottom:4px}
table.ip-items{width:100%;border-collapse:collapse;margin-bottom:8px}
.ip-items th{text-align:right;font-size:11px;color:#6b6b6b;font-weight:500;border-bottom:1px solid #232323;padding:6px 4px;background:none}
.ip-items td{font-size:13px;padding:8px 4px;border-bottom:1px solid #ddd6c4}
.ip-items th:nth-child(2),.ip-items td:nth-child(2){text-align:center;width:50px}
.ip-items th:nth-child(n+3),.ip-items td:nth-child(n+3){text-align:left;width:95px}
.ip-tot{margin-top:14px;margin-right:auto;width:250px;max-width:100%}
.ip-tot>div:not(.ip-stamp-w){display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:.5rem}
.ip-tot .g{border-top:1px solid #232323;margin-top:6px;padding-top:8px;font-size:16px;font-weight:700}
.ip-notes{margin-top:22px;font-size:12px;color:#6b6b6b;border-top:1px dashed #ddd6c4;padding-top:12px;white-space:pre-wrap}
.ip-foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.ip-badge{font-size:11px;padding:4px 12px;border-radius:20px;background:#e2e6ec;color:#3d4f66}
.ip-badge.paid{background:#dcecdf;color:#2e6b47}
.ip-badge.unpaid,.ip-badge.partial{background:#f4e1d0;color:#8f4c1c}
.ip-stamp-w{display:flex;justify-content:center;margin-top:12px}
.ip-stamp{width:96px;min-height:56px;border-radius:50%;border:1px solid #1d4f8c;outline:.75px solid #1d4f8c;outline-offset:1.5px;color:#1d4f8c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 7px;transform:rotate(-8deg);opacity:.85;text-align:center}
.ip-stamp .sa{font-size:6.5px;font-weight:700;line-height:1.15}
.ip-stamp .se{font-size:4.6px;letter-spacing:.3px;font-weight:700;direction:ltr;line-height:1.1}
.ip-stamp .sl{width:55%;height:.5px;background:#1d4f8c;opacity:.6;margin:1px 0}
.ip-stamp .sm{font-size:4.2px;font-weight:600}
@media (max-width:520px){.ipaper{padding:22px 16px}.ip-head{flex-direction:column}.ip-doc{text-align:right}}
.rcpt{width:72mm;padding:3mm;font-size:12px;line-height:1.45;color:#000;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
.rcpt.a4{width:190mm;font-size:13px;padding:6mm}
.rcpt .c{text-align:center}
.rcpt h4{margin:0;font-size:15px}
.rcpt table{font-size:inherit}
.rcpt th,.rcpt td{padding:2px 0;border:0;background:none;color:#000;font-size:inherit}
.rcpt hr{border:0;border-top:1px dashed #000;margin:4px 0}
.rcpt .tt{font-size:16px;font-weight:700}

@media print{
  @page{margin:3mm}
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  .ipaper{max-width:none;padding:8mm 10mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:1100px){.today{grid-template-columns:1fr 1fr}.today>div:nth-child(3){border:0}}
@media (max-width:900px){
  .pos{grid-template-columns:minmax(0,1fr);height:100%}
  .pos-top{gap:.5rem;padding:.5rem .6rem}.brand span{display:none}
  #toast{bottom:calc(5rem + env(safe-area-inset-bottom,0px))}
  .catalog{padding:.7rem .7rem 5rem}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .cart{position:fixed;inset:0;z-index:40;transform:translateY(100%);transition:transform .22s ease-out;padding-top:env(safe-area-inset-top,0px)}
  .cart.open{transform:none}
  .cart-close{display:block}

  toFs(p){const o={};for(const k in p){const v=p[k];if(v===undefined)continue;o[k]=(v&&typeof v==='object'&&'__inc' in v)?firebase.firestore.FieldValue.increment(v.__inc):(v&&typeof v==='object')?JSON.parse(JSON.stringify(v)):v}return o},
  newId(c){return this.mode==='firebase'?this.fs.collection(c).doc().id:rid()},
  set(c,id,data){
    if(this.mode==='firebase'){this.fs.collection(c).doc(id).set(this.toFs(data)).catch(fail)}
    else{(this.cache[c]||={})[id]=this.applyPatch({id},data);this.saveLocal();this.emit()}
    return id;
  },
  add(c,data){return this.set(c,this.newId(c),data)},
  update(c,id,patch){
    if(this.mode==='firebase'){this.fs.collection(c).doc(id).set(this.toFs(patch),{merge:true}).catch(fail)}
    else{const col=(this.cache[c]||={});const o=col[id]||(col[id]={id});this.applyPatch(o,patch);this.saveLocal();this.emit()}
  },
  del(c,id){
    if(this.mode==='firebase'){this.fs.collection(c).doc(id).delete().catch(fail)}
    else{delete (this.cache[c]||{})[id];this.saveLocal();this.emit()}
  },
  async nextNo(key){
    if(this.mode!=='firebase'){const col=(this.cache.counters||={});const o=col[key]||(col[key]={id:key,n:0});o.n++;this.saveLocal();return o.n}
    if(!navigator.onLine)return null;
    const ref=this.fs.collection('counters').doc(key);
    const tx=this.fs.runTransaction(async t=>{const d=await t.get(ref);const n=(d.exists?(d.data().n||0):0)+1;t.set(ref,{n},{merge:true});return n});
    try{return await Promise.race([tx,new Promise(r=>setTimeout(()=>r(null),5000))])}catch(e){return null}
  },
  subscribe(p){
    this.unsubs.forEach(u=>u());this.unsubs=[];this.cache={};
    const fs=this.fs,admin=p.role==='admin';
    const watch=(name,q)=>this.unsubs.push(q.onSnapshot(s=>{const m={};s.forEach(d=>m[d.id]={id:d.id,...d.data()});this.cache[name]=m;this.emit()},e=>console.warn(name,e)));
    ['settings','products','customers'].forEach(c=>watch(c,fs.collection(c)));
    if(admin){['sales','shifts','users','suppliers','purchases','expenses','payments','stockmoves','invoices','appointments','serviceCosts'].forEach(c=>watch(c,fs.collection(c)))}
    else{watch('sales',fs.collection('sales').where('cashierId','==',p.id));watch('shifts',fs.collection('shifts').where('cashierId','==',p.id))}
  },
  stop(){this.unsubs.forEach(u=>u());this.unsubs=[]}
};

async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('c7pos:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of 'c7pos:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'h'+h}
}

function parseConfig(txt){
  const o={};const re=/(\w+)\s*:\s*["']([^"']*)["']/g;let m;
  while((m=re.exec(txt)))o[m[1]]=m[2];
  return (o.apiKey&&o.projectId)?o:null;
}

function authMsg(e){const c=(e&&e.code)||'';if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return 'اسم المستخدم أو كلمة المرور غير صحيحة.';if(/too-many/.test(c))return 'محاولات كثيرة. انتظر دقائق ثم حاول مجدداً.';if(/network/.test(c))return 'لا يوجد اتصال بالإنترنت. أول دخول يحتاج إنترنت.';if(/weak-password/.test(c))return 'كلمة المرور ضعيفة (6 أحرف على الأقل).';if(/email-already/.test(c))return 'اسم المستخدم مستخدم مسبقاً.';if(/requires-recent-login/.test(c))return 'سجّل الخروج ثم الدخول مجدداً قبل تغيير كلمة المرور.';return (e&&e.message)||'حدث خطأ غير متوقع.'}

async function doLogin(){
  const u=val('lg-user').toLowerCase(),p=val('lg-pass'),err=$('#lg-err'),btn=$('#lg-btn');
  if(!u||!p){err.textContent='أدخل اسم المستخدم وكلمة المرور.';return}
  btn.disabled=true;err.textContent='';
  if(DB.mode==='local'){
    const h=await hash(p);const usr=DB.list('users').find(x=>x.username===u);
    btn.disabled=false;
    if(!usr||usr.pass!==h){err.textContent='اسم المستخدم أو كلمة المرور غير صحيحة.';return}
    if(usr.active===false){err.textContent='هذا الحساب موقوف. تواصل مع الإدارة.';return}
    LS.set('c7pos_session',usr.id);enter(usr);
  }else{
    try{await DB.auth.signInWithEmailAndPassword(`${u}@${EMAIL_DOMAIN}`,p)}catch(e){if(/api-key/.test((e&&e.code)||'')){LS.del('c7pos_fbcfg');return renderSetup('مفتاح الربط (apiKey) غير صحيح. انسخ كتلة firebaseConfig من إعدادات مشروع Firebase بزر النسخ والصقها هنا.')}err.textContent=authMsg(e);btn.disabled=false}
  }
}

async function boot(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  const cfg=currentConfig();const mode=cfg?'firebase':LS.get('c7pos_mode',null);
  if(!mode)return renderSetup();
  if(mode==='local'){
    DB.mode='local';DB.loadLocal();await seedLocal();
    const sid=LS.get('c7pos_session',null);const u=sid&&DB.get('users',sid);
    return (u&&u.active!==false)?enter(u):renderLogin();
  }
  renderLoading('جارِ الاتصال بقاعدة البيانات…');
  try{await loadFirebase()}catch(e){return renderLoading('تعذّر تحميل مكتبات الاتصال. تأكد من الإنترنت ثم أعد المحاولة.',true)}
  try{firebase.initializeApp(cfg)}catch(e){LS.del('c7pos_fbcfg');return renderLoading('إعدادات Firebase غير صحيحة. أعد فتح التطبيق وألصقها من جديد.',true)}
  DB.mode='firebase';DB.fs=firebase.firestore();DB.auth=firebase.auth();
  try{await DB.fs.enablePersistence({synchronizeTabs:true})}catch(e){console.warn('persistence',e)}
  DB.auth.onAuthStateChanged(async user=>{
    if(S._pu){S._pu();S._pu=null}
    if(!user){DB.stop();return renderLogin(S._authMsg||'')}
    S._authMsg='';renderLoading('جارِ تحميل البيانات…');
    const ref=DB.fs.collection('users').doc(user.uid);
    let snap=null;try{snap=await ref.get()}catch(e){}
    if(!snap||!snap.exists){
      let bs=null;try{bs=await DB.fs.collection('meta').doc('bootstrap').get()}catch(e){}
      if(bs&&!bs.exists){
        try{const b=DB.fs.batch();b.set(ref,{username:(user.email||'').split('@')[0],name:'المدير',role:'admin',active:true,maxDiscount:100,createdAt:Date.now()});b.set(DB.fs.collection('meta').doc('bootstrap'),{by:user.uid,at:Date.now()});await b.commit()}
        catch(e){S._authMsg='تعذّر إنشاء حساب المدير. تأكد من نشر قواعد الأمان (firestore.rules).';return DB.auth.signOut()}
      }else{S._authMsg=snap===null&&!navigator.onLine?'لا يوجد اتصال بالإنترنت لأول دخول على هذا الجهاز.':'هذا الحساب غير مفعّل في النظام. اطلب من الإدارة إضافته.';return DB.auth.signOut()}
    }
    S._pu=ref.onSnapshot(d=>{
      if(!d.exists)return;
      const p={id:d.id,...d.data()};
      if(p.active===false){S._authMsg='تم إيقاف هذا الحساب من الإدارة.';DB.auth.signOut();return}
      const first=!S.profile||S.profile.id!==p.id;S.profile=p;
      if(first)enter(p);else onData();
    },e=>console.warn(e));
  });
}

  const all=DB.list('products').filter(p=>p.active!==false);
  const list=all.filter(p=>(!S.cat||p.category===S.cat)&&(!q||String(p.name||'').toLowerCase().includes(q)||String(p.barcode||'').includes(q))).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
  g.innerHTML=list.length?list.map(p=>{
    const st=num(p.stock),out=!p.service&&st<=0,low=!p.service&&!out&&st<=num(p.minStock);
    return `<button class="pc ${out?'out':''}" onclick="addToCart('${p.id}')"><span class="pn">${esc(p.name)}</span><span class="pp">${money(p.price)}</span><span class="ps ${low?'low':''}">${p.service?'خدمة':out?'نفدت الكمية':`المتوفر ${st}${low?' (منخفض)':''}`}</span></button>`;
  }).join(''):`<div class="empty" style="grid-column:1/-1">${all.length?'لا توجد أصناف مطابقة للبحث.':(isAdmin()?'لا توجد أصناف بعد. أضفها من لوحة الإدارة، قسم المخزون والأصناف.':'لا توجد أصناف بعد. اطلب من الإدارة إضافتها.')}</div>`;
}
function scanEnter(){
  const q=S.q.trim();if(!q)return;
  const all=DB.list('products').filter(p=>p.active!==false);
  let p=all.find(x=>String(x.barcode||'')===q);
  if(!p){const m=all.filter(x=>String(x.name||'').toLowerCase().includes(q.toLowerCase())||String(x.barcode||'').includes(q));if(m.length===1)p=m[0]}
  if(p){addToCart(p.id);S.q='';$('#q').value='';renderGrid()}else toast('لم يُعثر على صنف بهذا الباركود.','err');
}
function addToCart(pid,qty=1){
  const p=DB.get('products',pid);if(!p)return;
  const l=S.cart.find(x=>x.pid===pid);const newQ=(l?l.qty:0)+qty;
  if(!p.service&&!SET().allowNegative&&newQ>num(p.stock)){toast(num(p.stock)>0?`المتوفر من هذا الصنف ${num(p.stock)} فقط.`:'نفدت كمية هذا الصنف.','err');return}
  if(l)l.qty=newQ;else S.cart.push({pid,name:p.name,price:num(p.price),cost:num(p.cost),qty,service:!!p.service});
  renderLines();renderSum();
}
function chQty(i,d){const l=S.cart[i];if(!l)return;if(l.qty+d<=0)return rmLine(i);if(d>0)return addToCart(l.pid,d);l.qty+=d;renderLines();renderSum()}
function setQty(i){const l=S.cart[i];promptBox('تعديل الكمية',l.name,l.qty,v=>{const q=Math.floor(num(v));if(q<=0)return rmLine(i);const p=DB.get('products',l.pid);if(p&&!p.service&&!SET().allowNegative&&q>num(p.stock))return toast(`المتوفر ${num(p.stock)} فقط.`,'err');l.qty=q;renderLines();renderSum()},true)}
function editPrice(i){const l=S.cart[i];promptBox('تعديل سعر البيع',l.name,l.price,v=>{l.price=r3(num(v));renderLines();renderSum()},true)}
function rmLine(i){S.cart.splice(i,1);renderLines();renderSum()}
function toggleCart(o){const c=$('#cart');c&&c.classList.toggle('open',o)}
function setMethod(m){
  S.method=m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const w=$('#recv-wrap');if(w){w.style.display=(m==='cash'||m==='credit')?'':'none';$('#recv-lbl').textContent=m==='credit'?'المدفوع الآن (والباقي دين على العميل)':'المبلغ المستلم'}
  renderSum();
}
function renderLines(){
  const el=$('#lines');if(!el)return;
  const c=S.custId&&DB.get('customers',S.custId);
  $('#cust-btn').innerHTML=c?`العميل: <b>${esc(c.name)}</b>${num(c.balance)>0?` <small style="color:#FFD08A">(عليه ${money(c.balance)})</small>`:''}`:'بدون عميل (بيع نقدي). اضغط لاختيار عميل';
  el.innerHTML=S.cart.length?S.cart.map((l,i)=>`<div class="ln"><div class="ln-n">${esc(l.name)}<small ${isAdmin()?`class="edit" onclick="editPrice(${i})" title="تعديل السعر"`:''}>${money(l.price)} للوحدة</small></div><div class="qty"><button onclick="chQty(${i},-1)" aria-label="إنقاص">−</button><button class="qv" onclick="setQty(${i})" aria-label="الكمية">${l.qty}</button><button onclick="chQty(${i},1)" aria-label="زيادة">+</button></div><div class="ln-t">${money(l.qty*l.price)}</div><button class="rm" onclick="rmLine(${i})" aria-label="حذف">×</button></div>`).join(''):`<div class="empty sm">السلة فارغة. اضغط على أي صنف لإضافته.</div>`;
}
function totals(){
  const st=SET();const sub=r3(sum(S.cart,l=>l.qty*l.price));
  let disc=S.discType==='%'?r3(sub*num(S.disc)/100):r3(num(S.disc));disc=Math.min(Math.max(disc,0),sub);
  const vatRate=st.vatOn?num(st.vatRate):0;const vat=r3((sub-disc)*vatRate/100);
  return {sub,disc,vat,vatRate,total:r3(sub-disc+vat),cost:r3(sum(S.cart,l=>l.qty*l.cost)),pct:sub?disc/sub*100:0,count:sum(S.cart,l=>l.qty)};
}
function renderSum(){
  const el=$('#sum');if(!el)return;const t=totals(),mx=maxDisc();
  let extra='';
  if(S.method==='cash'&&S.received!==''&&t.total){const ch=r3(num(S.received)-t.total);extra=`<div class="row ${ch<0?'neg':''}"><span>${ch<0?'المبلغ ناقص':'الباقي للعميل'}</span><b>${money(Math.abs(ch))}</b></div>`}
  if(S.method==='credit'&&t.total){const due=r3(t.total-Math.min(num(S.received),t.total));extra=`<div class="row neg"><span>يُسجَّل ديناً على العميل</span><b>${money(due)}</b></div>`}
  el.innerHTML=`<div class="row"><span>المجموع (${t.count} قطعة)</span><b>${money(t.sub)}</b></div>${t.disc?`<div class="row"><span>الخصم</span><b>− ${money(t.disc)}</b></div>`:''}${t.vatRate?`<div class="row"><span>ضريبة القيمة المضافة ${t.vatRate}%</span><b>${money(t.vat)}</b></div>`:''}<div class="led"><span>${esc(cur())}</span><output>${money(t.total)}</output></div>${extra}${t.pct>mx+1e-6?`<div class="warn">الخصم يتجاوز الحد المسموح لك (${mx}%).</div>`:''}`;
  const b=$('#mbar');if(b)b.innerHTML=`<span>السلة: ${t.count} قطعة</span><b>${money(t.total)} ${esc(cur())}</b>`;
}

async function checkout(){
  if(S.busy)return;
  const t=totals(),st=SET();
  if(!S.cart.length)return toast('السلة فارغة.','err');
  const sh=autoShift();
  if(t.pct>maxDisc()+1e-6)return toast(`الخصم يتجاوز الحد المسموح لك (${maxDisc()}%).`,'err');
  const c=S.custId&&DB.get('customers',S.custId);
  if(S.method==='credit'&&!c){toast('البيع الآجل يحتاج اختيار عميل.','err');return pickCustomer()}
  if(S.method==='cash'&&S.received!==''&&num(S.received)<t.total)return toast('المبلغ المستلم أقل من الإجمالي. اختر "آجل" لتسجيل الباقي ديناً.','err');
  if(!st.allowNegative)for(const l of S.cart){const p=DB.get('products',l.pid);if(p&&!p.service&&l.qty>num(p.stock))return toast(`الكمية غير متوفرة: ${l.name} (المتوفر ${num(p.stock)})`,'err')}
  S.busy=true;const btn=$('#pay-btn');if(btn){btn.disabled=true;btn.textContent='جارِ الحفظ…'}
  try{
    const n=await DB.nextNo('sales');
    const no=n?`${st.prefix}-${String(n).padStart(5,'0')}`:`${st.prefix}-${Date.now().toString(36).toUpperCase()}`;
    const paid=S.method==='credit'?r3(Math.min(num(S.received),t.total)):t.total;
    const received=S.method==='cash'&&S.received!==''?r3(num(S.received)):null;
    const sale={no,date:Date.now(),day:dkey(),cashierId:S.profile.id,cashierName:S.profile.name||S.profile.username,shiftId:sh.id,
      customerId:c?c.id:'',customerName:c?c.name:'',customerPhone:c?(c.phone||''):'',
      items:S.cart.map(l=>({pid:l.pid,name:l.name,qty:l.qty,price:l.price,cost:l.cost,service:l.service})),
      subtotal:t.sub,discount:t.disc,vat:t.vat,vatRate:t.vatRate,total:t.total,cost:t.cost,method:S.method,paid,due:r3(t.total-paid),
      received,change:received!=null?r3(received-t.total):0,status:'done'};
    const id=DB.add('sales',sale);
    for(const l of S.cart)if(!l.service)DB.update('products',l.pid,{stock:DB.inc(-l.qty)});
    if(sale.due>0)DB.update('customers',c.id,{balance:DB.inc(sale.due)});
    S.cart=[];S.disc='';S.received='';S.custId='';
    const d=$('#disc');if(d)d.value='';const r=$('#recv');if(r)r.value='';
    setMethod('cash');renderLines();toggleCart(false);
    receiptModal({id,...sale});
  }catch(e){fail(e)}
  finally{S.busy=false;if(btn){btn.disabled=false;btn.textContent='إتمام البيع (F9)'}}
}

  <hr><div class="c"><b>${st.vatOn?'فاتورة ضريبية مبسطة':'فاتورة بيع'}</b>${s.status==='returned'?' (مرتجعة)':''}</div>
  <div>رقم: <b>${esc(s.no)}</b></div><div>التاريخ: ${fdt(s.date)}</div><div>البائع: ${esc(s.cashierName)}</div>${s.customerName?`<div>العميل: ${esc(s.customerName)}</div>`:''}
  <hr><table style="width:100%"><thead><tr><th style="text-align:start">الصنف</th><th>الكمية</th><th style="text-align:end">المبلغ</th></tr></thead><tbody>
  ${(s.items||[]).map(i=>`<tr><td>${esc(i.name)}<br><span style="font-size:.9em">${money(i.price)}</span></td><td style="text-align:center">${i.qty}</td><td style="text-align:end">${money(i.qty*i.price)}</td></tr>`).join('')}
  </tbody></table><hr>
  <table style="width:100%"><tr><td>المجموع</td><td style="text-align:end">${money(s.subtotal)}</td></tr>
  ${num(s.discount)?`<tr><td>الخصم</td><td style="text-align:end">- ${money(s.discount)}</td></tr>`:''}
  ${num(s.vat)?`<tr><td>ضريبة ${s.vatRate}%</td><td style="text-align:end">${money(s.vat)}</td></tr>`:''}
  <tr class="tt"><td>الإجمالي</td><td style="text-align:end">${money(s.total)} ${esc(st.currency)}</td></tr>
  <tr><td>طريقة الدفع</td><td style="text-align:end">${METHODS[s.method]||s.method}</td></tr>
  ${s.received!=null?`<tr><td>المستلم</td><td style="text-align:end">${money(s.received)}</td></tr><tr><td>الباقي</td><td style="text-align:end">${money(s.change)}</td></tr>`:''}
  ${num(s.due)?`<tr><td>المدفوع</td><td style="text-align:end">${money(s.paid)}</td></tr><tr><td><b>المتبقي آجلاً</b></td><td style="text-align:end"><b>${money(s.due)}</b></td></tr>`:''}
  </table><hr><div class="c">${esc(st.footer||'')}</div></div>`;
}
function waLink(s){
  const st=SET();
  const lines=[`*${st.companyName}*`,`فاتورة رقم: ${s.no}`,`التاريخ: ${fdt(s.date)}`,'',...(s.items||[]).map(i=>`• ${i.name} × ${i.qty} = ${money(i.qty*i.price)}`),'',num(s.discount)?`الخصم: ${money(s.discount)}`:'',num(s.vat)?`الضريبة: ${money(s.vat)}`:'',`*الإجمالي: ${money(s.total)} ${st.currency}*`,num(s.due)?`المتبقي آجلاً: ${money(s.due)}`:'','',st.footer||''].filter((x,i,a)=>x!==''||a[i-1]!=='');
  let ph=String(s.customerPhone||'').replace(/\D/g,'');if(ph.length===8)ph='968'+ph;
  return `https://wa.me/${ph}?text=${encodeURIComponent(lines.join('\n'))}`;
}
function receiptModal(s){
  S._rc=s;
  modal(`تم البيع: ${s.no}`,`<div class="rc-prev">${receiptHTML(s)}</div>`,`<button class="btn amber" onclick="closeModal();const q=$('#q');q&&q.focus()">بيع جديد</button><button class="btn pri" onclick="printHTML(receiptHTML(S._rc))">طباعة</button><a class="btn" href="${waLink(s)}" target="_blank" rel="noopener">إرسال واتساب</a>`);
}

function pickCustomer(){
  modal('اختيار العميل',`${field('بحث',`<input id="cp-q" type="search" placeholder="الاسم أو رقم الهاتف" oninput="fillCustPick()">`)}<div id="cp-list" class="list-s"></div>
  <details><summary style="cursor:pointer;font-weight:600">إضافة عميل جديد</summary><div class="grid2" style="margin-top:.7rem">${field('الاسم',`<input id="nc-name">`)}${field('الهاتف',`<input id="nc-phone" inputmode="tel" dir="ltr">`)}</div><button class="btn pri" style="margin-top:.7rem" onclick="quickCustomer()">إضافة واختيار</button></details>`,
  `<button class="btn" onclick="S.custId='';closeModal();renderLines()">بدون عميل</button>`);
  fillCustPick();
}
function fillCustPick(){
  const q=val('cp-q').toLowerCase();
  const l=DB.list('customers').filter(c=>!q||String(c.name).toLowerCase().includes(q)||String(c.phone||'').includes(q)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar')).slice(0,40);
  $('#cp-list').innerHTML=l.length?l.map(c=>`<div><button class="link" onclick="S.custId='${c.id}';closeModal();renderLines()">${esc(c.name)}</button><span class="num">${esc(c.phone||'')}${num(c.balance)>0?` <span class="badge warn">عليه ${money(c.balance)}</span>`:''}</span></div>`).join(''):`<div class="empty sm">لا يوجد عملاء مطابقون.</div>`;
}
function quickCustomer(){
  const name=val('nc-name');if(!name)return toast('اكتب اسم العميل.','err');
  const id=DB.add('customers',{name,phone:val('nc-phone'),balance:0,createdAt:Date.now()});
  S.custId=id;closeModal();setTimeout(renderLines,120);
}

function openShiftModal(fromCheckout){
  modal('فتح وردية',`${fromCheckout?'<div class="note">افتح الوردية أولاً ثم أكمل البيع. السلة محفوظة.</div>':''}${field('النقد الموجود في الدرج عند البداية',`<input id="sh-open" inputmode="decimal" value="0">`)}`,`<button class="btn amber" onclick="doOpenShift()">فتح الوردية</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function doOpenShift(){
  if(myShift())return closeModal();
  DB.add('shifts',{cashierId:S.profile.id,cashierName:S.profile.name||S.profile.username,openedAt:Date.now(),day:dkey(),openingCash:r3(num(val('sh-open'))),status:'open'});
  closeModal();toast('تم فتح الوردية.','ok');
}
function shiftStats(sh){
  const sales=DB.list('sales').filter(s=>s.shiftId===sh.id&&s.status!=='returned');
  const by={};for(const s of sales)by[s.method]=(by[s.method]||0)+num(s.total);
  const cashIn=sum(sales,s=>s.method==='cash'?s.total:s.method==='credit'?s.paid:0);
  return {count:sales.length,total:sum(sales,s=>s.total),by,cashIn:r3(cashIn),expected:r3(num(sh.openingCash)+cashIn),credit:sum(sales,s=>s.due)};
}
function closeShiftModal(){
  const sh=myShift();if(!sh)return;const x=shiftStats(sh);
  modal('إغلاق الوردية',`<div class="list-s">
    <div><span>بدأت</span><b class="num">${fdt(sh.openedAt)}</b></div>
    <div><span>عدد الفواتير</span><b class="num">${x.count}</b></div>
    <div><span>إجمالي المبيعات</span><b class="num">${money(x.total)}</b></div>
    ${Object.entries(x.by).map(([k,v])=>`<div><span>${METHODS[k]||k}</span><b class="num">${money(v)}</b></div>`).join('')}
    <div><span>نقد البداية</span><b class="num">${money(sh.openingCash)}</b></div>
    <div><span>النقد المتوقع في الدرج</span><b class="num">${money(x.expected)}</b></div></div>
    ${field('النقد الفعلي بعد العدّ',`<input id="sh-count" inputmode="decimal" oninput="shDiff(this.value,${x.expected})">`)}<div id="sh-diff"></div>
    ${field('ملاحظة (اختياري)',`<input id="sh-note">`)}`,
  `<button class="btn amber" onclick="doCloseShift()">إغلاق الوردية</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function handoverModal(){
  if(!myShift())return;
  modal('تسليم الدرج',`<div class="note">عُدّ كل النقد الموجود في الدرج (بما فيه الفكّة) واكتب المبلغ كما هو. بعد التسليم تُغلق ورديتك، وتبدأ وردية جديدة تلقائياً مع أول بيع قادم.</div>${field('النقد الموجود في الدرج',`<input id="sh-count" inputmode="decimal">`)}${field('ملاحظة (اختياري)',`<input id="sh-note">`)}`,`<button class="btn amber" onclick="doCloseShift(true)">تسليم الدرج</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function handoverHTML(sh){const st=SET();return `<div class="rcpt" dir="rtl"><div class="c"><h4>${esc(st.companyName)}</h4><b>إيصال تسليم الدرج</b></div><hr><div>الموظف: ${esc(sh.cashierName)}</div><div>من: ${fdt(sh.openedAt)}</div><div>إلى: ${fdt(sh.closedAt)}</div><hr><table style="width:100%"><tr class="tt"><td>النقد المسلَّم</td><td style="text-align:end">${money(sh.countedCash)}</td></tr></table>${sh.note?`<div>ملاحظة: ${esc(sh.note)}</div>`:''}<hr><div>توقيع المستلم: ..................</div></div>`}
function shDiff(v,exp){const d=r3(num(v)-exp);$('#sh-diff').innerHTML=v===''?'':`الفرق: <b class="${d<0?'neg-v':'pos-v'}">${money(d)}</b>`}
function doCloseShift(blind){
  const sh=myShift();if(!sh)return;const x=shiftStats(sh);
  if(val('sh-count')==='')return toast('أدخل النقد الفعلي بعد العدّ.','err');
  const counted=r3(num(val('sh-count')));
  const data={status:'closed',closedAt:Date.now(),salesCount:x.count,salesTotal:r3(x.total),cashIn:x.cashIn,expectedCash:x.expected,countedCash:counted,diff:r3(counted-x.expected),byMethod:x.by,note:val('sh-note')};
  DB.update('shifts',sh.id,data);closeModal();S.curShift=null;
  const all={...sh,...data};S._sh=all;
  if(blind){renderPosHead();return modal('تم تسليم الدرج',`<p style="margin:0">تم تسجيل النقد المسلَّم: <b class="num">${money(counted)} ${esc(cur())}</b>. شكراً لك.</p>`,`<button class="btn pri" onclick="printHTML(handoverHTML(S._sh))">طباعة إيصال التسليم</button><button class="btn" onclick="closeModal()">تم</button>`)}
  modal('تم إغلاق الوردية',`<div class="list-s"><div><span>المبيعات</span><b class="num">${money(all.salesTotal)}</b></div><div><span>النقد المتوقع</span><b class="num">${money(all.expectedCash)}</b></div><div><span>النقد الفعلي</span><b class="num">${money(all.countedCash)}</b></div><div><span>الفرق</span><b class="num ${all.diff<0?'neg-v':'pos-v'}">${money(all.diff)}</b></div></div>`,`<button class="btn pri" onclick="printHTML(shiftHTML(S._sh))">طباعة التقرير</button><button class="btn" onclick="closeModal()">تم</button>`);

function calc(a,b){
  const inR=d=>d>=a&&d<=b;
  const all=DB.list('sales').filter(s=>inR(s.day));
  const done=all.filter(s=>s.status!=='returned'),ret=all.filter(s=>s.status==='returned');
  const invs=DB.list('invoices').filter(v=>v.docType==='invoice'&&!v.cancelled&&inR(v.day));
  const r={count:done.length+invs.length,posCount:done.length,invCount:invs.length,invTotal:0,sales:0,disc:0,vat:0,cost:0,due:0,retCount:ret.length,retTotal:sum(ret,s=>s.total),byMethod:{},byCashier:{},byProduct:{},byCat:{},byDay:{},byExp:{}};
  const add=(s,ck,cn,method,due,fallbackCat)=>{
    const tot=num(s.total),net=tot-num(s.vat);
    r.sales+=tot;r.disc+=num(s.discount);r.vat+=num(s.vat);r.cost+=num(s.cost);r.due+=due;
    r.byMethod[method]=(r.byMethod[method]||0)+tot;
    const c=r.byCashier[ck]||(r.byCashier[ck]={name:cn,count:0,total:0,profit:0});c.count++;c.total+=tot;c.profit+=net-num(s.cost);
    const d=r.byDay[s.day]||(r.byDay[s.day]={count:0,total:0,profit:0});d.count++;d.total+=tot;d.profit+=net-num(s.cost);
    const sub=num(s.subtotal)||1,f=1-num(s.discount)/sub;
    for(const i of s.items||[]){
      const q=num(i.qty),rev=q*num(i.price)*f,pr=rev-q*num(i.cost),key=i.pid||('n:'+i.name),prod=i.pid&&DB.get('products',i.pid);
      const p=r.byProduct[key]||(r.byProduct[key]={name:i.name,qty:0,rev:0,profit:0,service:i.service||!i.pid});p.qty+=q;p.rev+=rev;p.profit+=pr;
      const cat=(prod&&prod.category)||fallbackCat||'بدون تصنيف';const cc=r.byCat[cat]||(r.byCat[cat]={rev:0,profit:0,qty:0});cc.rev+=rev;cc.profit+=pr;cc.qty+=q;
    }
  };
  for(const s of done)add(s,s.cashierId,s.cashierName,s.method,num(s.due));
  for(const v of invs){const due=Math.max(0,num(v.total)-num(v.paid));r.invTotal+=num(v.total);add(v,'__inv','الفواتير (الإدارة)',due>0.0005?'credit':(v.method||'cash'),due,(v.categories||[])[0]||'خدمات')}
  r.revenue=r.sales-r.vat;r.gross=r.revenue-r.cost;
  const ex=DB.list('expenses').filter(e=>inR(e.day));r.expenses=sum(ex,e=>e.amount);r.expHome=sum(ex.filter(e=>e.type==='home'),e=>e.amount);r.expCompany=r.expenses-r.expHome;
  for(const e of ex)r.byExp[e.category||'أخرى']=(r.byExp[e.category||'أخرى']||0)+num(e.amount);
  r.netProfit=r.gross-r.expenses;r.margin=r.revenue?r.gross/r.revenue*100:0;
  return r;
}

  <div class="list-s"><div><span>الإجمالي</span><b class="num">${money(s.total)}</b></div><div><span>التكلفة</span><b class="num">${money(s.cost)}</b></div><div><span>الربح</span><b class="num">${money(num(s.total)-num(s.vat)-num(s.cost))}</b></div><div><span>الحالة</span><b>${s.status==='returned'?'<span class="badge bad">مرتجعة</span>':'<span class="badge ok">منفذة</span>'}</b></div></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>الصنف</th><th class="n">الكمية</th><th class="n">السعر</th><th class="n">التكلفة</th><th class="n">المبلغ</th></tr></thead><tbody>${(s.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td class="n">${i.qty}</td><td class="n">${money(i.price)}</td><td class="n">${money(i.cost)}</td><td class="n">${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table></div>`,
  `<button class="btn pri" onclick="printHTML(receiptHTML(S._rc))">طباعة</button><a class="btn" href="${waLink(s)}" target="_blank" rel="noopener">واتساب</a>${isAdmin()&&s.status!=='returned'?`<button class="btn danger" onclick="returnSale('${s.id}')">إرجاع الفاتورة</button>`:''}`,true);
}
function returnSale(id){
  const s=DB.get('sales',id);
  confirmBox(`إرجاع الفاتورة ${esc(s.no)} بالكامل؟ ستعود الكميات للمخزون${num(s.due)?' ويُخصم الدين من حساب العميل':''}، ويجب رد المبلغ المدفوع (${money(s.paid)}) للعميل.`,()=>{
    DB.update('sales',id,{status:'returned',returnedAt:Date.now(),returnedBy:S.profile.name||S.profile.username});
    for(const i of s.items||[])if(!i.service)DB.update('products',i.pid,{stock:DB.inc(i.qty)});
    if(num(s.due)>0&&s.customerId)DB.update('customers',s.customerId,{balance:DB.inc(-num(s.due))});

/* ---- المخزون والأصناف ---- */
HEAD.products=()=>`<div class="hrow"><h1>المخزون والأصناف</h1><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" onclick="exportProducts()">تصدير CSV</button><button class="btn pri" onclick="productModal()">إضافة صنف</button></div></div>
<div class="filters">${field('بحث',`<input type="search" placeholder="الاسم أو الباركود" value="${esc(S.f.pq||'')}" oninput="S.f.pq=this.value;renderBody()">`)}${field('التصنيف',`<select onchange="S.f.pc=this.value;renderBody()"><option value="">الكل</option>${opts(splitList(SET().categories),S.f.pc)}</select>`)}${field('الحالة',`<select onchange="S.f.ps=this.value;renderBody()">${opts([['','الكل'],['low','تحت حد الطلب'],['out','نفدت'],['svc','الخدمات فقط']],S.f.ps)}</select>`)}</div>`;
function filteredProducts(){const q=String(S.f.pq||'').toLowerCase(),c=S.f.pc,s=S.f.ps;return DB.list('products').filter(p=>(!q||String(p.name).toLowerCase().includes(q)||String(p.barcode||'').includes(q))&&(!c||p.category===c)&&(!s||(s==='low'&&!p.service&&num(p.stock)<=num(p.minStock))||(s==='out'&&!p.service&&num(p.stock)<=0)||(s==='svc'&&p.service))).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'))}
BODY.products=()=>{
  const l=filteredProducts(),goods=l.filter(p=>!p.service);
  return `<div class="stats"><div class="stat"><div class="k">عدد الأصناف</div><div class="v">${l.length}</div></div><div class="stat"><div class="k">قيمة المخزون بالتكلفة</div><div class="v">${money(sum(goods,p=>Math.max(0,num(p.stock))*num(p.cost)))}</div></div><div class="stat"><div class="k">قيمته بسعر البيع</div><div class="v">${money(sum(goods,p=>Math.max(0,num(p.stock))*num(p.price)))}</div></div></div>
  ${l.length?`<div class="tbl-wrap"><table><thead><tr><th>الصنف</th><th>التصنيف</th><th>الباركود</th><th class="n">التكلفة</th><th class="n">سعر البيع</th><th class="n">الهامش</th><th class="n">المتوفر</th><th></th></tr></thead><tbody>${l.map(p=>{const st=num(p.stock),mg=num(p.price)?(num(p.price)-num(p.cost))/num(p.price)*100:0;return `<tr><td>${esc(p.name)} ${p.active===false?'<span class="badge">موقوف</span>':''}</td><td>${esc(p.category||'-')}</td><td class="num">${esc(p.barcode||'')}</td><td class="n">${money(p.cost)}</td><td class="n">${money(p.price)}</td><td class="n">${mg.toFixed(0)}%</td><td class="n">${p.service?'<span class="badge">خدمة</span>':`<span class="badge ${st<=0?'bad':st<=num(p.minStock)?'warn':'ok'}">${st} ${esc(p.unit||'')}</span>`}</td><td><div class="acts"><button class="btn sm" onclick="productModal('${p.id}')">تعديل</button>${p.service?'':`<button class="btn sm" onclick="adjustModal('${p.id}')">جرد / تسوية</button>`}</div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="panel empty">لا توجد أصناف. ابدأ بإضافة أول صنف أو خدمة.</div>'}`;
};
function productModal(id){
  const p=id?DB.get('products',id):{active:true,unit:'حبة',minStock:0,stock:0};
  modal(id?'تعديل صنف':'إضافة صنف',`${field('اسم الصنف أو الخدمة',`<input id="p-name" value="${esc(p.name||'')}">`)}
  <label class="chk"><input type="checkbox" id="p-svc" ${p.service?'checked':''} onchange="document.querySelectorAll('.goods-only').forEach(e=>e.style.display=this.checked?'none':'')"> خدمة (تركيب، صيانة…) بدون مخزون</label>
  <div class="grid2">${field('التصنيف',`<input id="p-cat" list="cats" value="${esc(p.category||'')}"><datalist id="cats">${opts(splitList(SET().categories))}</datalist>`)}${field('الباركود',`<input id="p-bar" dir="ltr" value="${esc(p.barcode||'')}">`)}</div>
  <div class="grid3">${field('سعر التكلفة',`<input id="p-cost" inputmode="decimal" value="${p.cost??''}">`)}${field('سعر البيع',`<input id="p-price" inputmode="decimal" value="${p.price??''}">`)}${field('الوحدة',`<input id="p-unit" value="${esc(p.unit||'')}">`)}</div>
  <div class="grid2 goods-only" style="${p.service?'display:none':''}">${id?`<div class="note">لتعديل الكمية استخدم زر "جرد / تسوية" حتى تبقى الحركة مسجّلة. المتوفر الآن: <b>${num(p.stock)}</b></div>`:field('الكمية الافتتاحية',`<input id="p-stock" inputmode="decimal" value="0">`)}${field('حد إعادة الطلب',`<input id="p-min" inputmode="decimal" value="${p.minStock??0}">`)}</div>
  <label class="chk"><input type="checkbox" id="p-act" ${p.active!==false?'checked':''}> يظهر في نقطة البيع</label>`,
  `<button class="btn pri" onclick="saveProduct('${id||''}')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button>${id?`<button class="btn danger" style="margin-inline-start:auto" onclick="delProduct('${id}')">حذف</button>`:''}`);
}
function saveProduct(id){
  const name=val('p-name');if(!name)return toast('اكتب اسم الصنف.','err');
  const bar=val('p-bar');if(bar&&DB.list('products').some(x=>x.barcode===bar&&x.id!==id))return toast('هذا الباركود مستخدم لصنف آخر.','err');
  const data={name,category:val('p-cat'),barcode:bar,cost:r3(num(val('p-cost'))),price:r3(num(val('p-price'))),unit:val('p-unit'),service:chk('p-svc'),minStock:num(val('p-min')),active:chk('p-act'),updatedAt:Date.now()};
  if(data.price<data.cost&&!confirm('سعر البيع أقل من التكلفة. حفظ على أي حال؟'))return;
  if(id)DB.update('products',id,data);else DB.add('products',{...data,stock:data.service?0:num(val('p-stock')),createdAt:Date.now()});
  closeModal();toast('تم الحفظ.','ok');
}
function delProduct(id){confirmBox('حذف الصنف نهائياً؟ الفواتير السابقة تبقى كما هي. يُفضّل إيقافه بدلاً من الحذف.',()=>{DB.del('products',id);toast('تم الحذف.')},'حذف')}
function adjustModal(id){
  const p=DB.get('products',id);
  modal(`جرد / تسوية: ${p.name}`,`<div class="note">الكمية في النظام: <b>${num(p.stock)}</b></div>${field('الكمية الفعلية بعد العدّ',`<input id="aj-q" inputmode="decimal" value="${num(p.stock)}">`)}${field('السبب',`<select id="aj-r">${opts(['جرد دوري','تالف','فقد','تصحيح إدخال','استخدام داخلي'])}</select>`)}`,
  `<button class="btn pri" onclick="doAdjust('${id}')">حفظ التسوية</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function doAdjust(id){
  const p=DB.get('products',id),q=num(val('aj-q')),d=r3(q-num(p.stock));
  if(d){DB.update('products',id,{stock:DB.inc(d)});DB.add('stockmoves',{pid:id,name:p.name,diff:d,reason:val('aj-r'),cost:num(p.cost),by:S.profile.name||S.profile.username,date:Date.now(),day:dkey()})}
  closeModal();toast(d?`تمت التسوية (${d>0?'+':''}${d}).`:'لا يوجد فرق.','ok');
}
function exportProducts(){const rows=[['الصنف','التصنيف','الباركود','التكلفة','سعر البيع','المتوفر','حد الطلب','خدمة']];filteredProducts().forEach(p=>rows.push([p.name,p.category,p.barcode,p.cost,p.price,p.service?'':p.stock,p.minStock,p.service?'نعم':'']));download('products.csv',csv(rows))}

/* ---- المشتريات ---- */
HEAD.purchases=()=>`<div class="hrow"><h1>المشتريات</h1><button class="btn pri" onclick="purchaseModal()">فاتورة شراء جديدة</button></div><div class="filters">${field('الشهر',`<input type="month" value="${S.f.pm||mkey()}" onchange="S.f.pm=this.value;renderBody()">`)}</div>`;
BODY.purchases=()=>{
  const m=S.f.pm||mkey(),l=DB.list('purchases').filter(p=>String(p.day).startsWith(m)||p.status==='pending').sort((a,b)=>b.date-a.date);
  return `<div class="stats"><div class="stat"><div class="k">فواتير الشراء</div><div class="v">${l.length}</div></div><div class="stat"><div class="k">إجمالي المشتريات</div><div class="v">${money(sum(l,p=>p.total))}</div></div><div class="stat"><div class="k">غير المدفوع منها</div><div class="v">${money(sum(l,p=>num(p.total)-num(p.paid)))}</div></div></div>
  ${l.length?`<div class="tbl-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>المورد</th><th>الأصناف</th><th class="n">الإجمالي</th><th class="n">المدفوع</th><th>الحالة</th></tr></thead><tbody>${l.map(p=>`<tr><td>${esc(p.no)}</td><td class="num">${esc(p.day)}</td><td>${esc(p.supplierName||'-')}</td><td>${(p.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join('، ')}</td><td class="n">${money(p.total)}</td><td class="n">${money(p.paid)}</td><td>${p.status==='pending'?`<span class="badge warn">بانتظار الاستلام</span> <button class="btn sm pri" onclick="receivePurchase('${p.id}')">تأكيد الاستلام</button>`:'<span class="badge ok">مستلم</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">لا توجد مشتريات في هذا الشهر. سجّل فاتورة الشراء لتُضاف الكميات للمخزون تلقائياً.</div>'}`;
};
function purchaseModal(){
  const goods=DB.list('products').filter(p=>!p.service).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
  if(!goods.length)return toast('أضف الأصناف أولاً من قسم المخزون.','err');
  S.pl=[{pid:goods[0].id,qty:1,cost:num(goods[0].cost)}];
  modal('فاتورة شراء',`<div class="grid2">${field('المورد',`<select id="pu-sup"><option value="">بدون مورد</option>${opts(DB.list('suppliers').map(s=>[s.id,s.name]))}</select>`)}${field('التاريخ',`<input id="pu-day" type="date" value="${dkey()}">`)}</div>
  <div class="plines" id="pl"></div><button class="btn" onclick="S.pl.push({pid:'',qty:1,cost:0});renderPL()">إضافة سطر</button>
  <div class="grid2">${field('المبلغ المدفوع الآن',`<input id="pu-paid" inputmode="decimal" placeholder="اتركه فارغاً إذا دُفع بالكامل">`)}<div class="note" id="pu-tot"></div></div>
  <label class="chk"><input type="checkbox" id="pu-recv" checked> تم استلام البضاعة الآن (ألغِ التحديد إذا كان طلب توريد لم يصل بعد)</label>
  <div class="note">عند الاستلام تُضاف الكميات للمخزون، ويُحدَّث سعر التكلفة بالمتوسط المرجّح، ويُسجَّل غير المدفوع ديناً للمورد.</div>`,
  `<button class="btn pri" onclick="savePurchase()">حفظ فاتورة الشراء</button><button class="btn" onclick="closeModal()">إلغاء</button>`,true);
  renderPL();
}
function renderPL(){
  const goods=DB.list('products').filter(p=>!p.service).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
  $('#pl').innerHTML=S.pl.map((l,i)=>`<div class="pl">${field(i?'':'الصنف',`<select onchange="S.pl[${i}].pid=this.value;const p=DB.get('products',this.value);S.pl[${i}].cost=p?num(p.cost):0;renderPL()"><option value="">اختر</option>${opts(goods.map(p=>[p.id,p.name]),l.pid)}</select>`)}${field(i?'':'الكمية',`<input inputmode="decimal" value="${l.qty}" oninput="S.pl[${i}].qty=num(this.value);puTot()">`)}${field(i?'':'تكلفة الوحدة',`<input inputmode="decimal" value="${l.cost}" oninput="S.pl[${i}].cost=num(this.value);puTot()">`)}<button class="btn sm" onclick="S.pl.splice(${i},1);renderPL()" aria-label="حذف السطر">×</button></div>`).join('');
  puTot();
}
function puTot(){const t=r3(sum(S.pl,l=>l.qty*l.cost));const e=$('#pu-tot');if(e)e.innerHTML=`الإجمالي: <b class="num">${money(t)} ${esc(cur())}</b>`;return t}
async function savePurchase(){
  const lines=S.pl.filter(l=>l.pid&&l.qty>0);if(!lines.length)return toast('أضف صنفاً واحداً على الأقل.','err');
  const total=puTot(),paid=val('pu-paid')===''?total:r3(Math.min(num(val('pu-paid')),total));
  const sup=DB.get('suppliers',val('pu-sup'));if(paid<total&&!sup)return toast('اختر المورد لتسجيل المبلغ غير المدفوع ديناً له.','err');
  const n=await DB.nextNo('purchases');
  const items=lines.map(l=>({pid:l.pid,name:DB.get('products',l.pid).name,qty:l.qty,cost:r3(l.cost)}));
  const recv=chk('pu-recv');
  const doc={no:n?`PO-${String(n).padStart(4,'0')}`:`PO-${Date.now().toString(36).toUpperCase()}`,date:Date.now(),day:val('pu-day')||dkey(),supplierId:sup?sup.id:'',supplierName:sup?sup.name:'',items,total,paid,status:recv?'received':'pending',by:S.profile.name||S.profile.username};
  const id=DB.add('purchases',doc);
  if(recv)applyPurchase(doc);
  closeModal();toast(recv?'تم حفظ فاتورة الشراء وتحديث المخزون.':'تم حفظ طلب التوريد. أكّد الاستلام عند وصول البضاعة.','ok');
}
function applyPurchase(doc){
  for(const i of doc.items||[]){const p=i.pid&&DB.get('products',i.pid);if(!p)continue;const st=Math.max(0,num(p.stock));const nc=st+i.qty>0?r3((st*num(p.cost)+i.qty*i.cost)/(st+i.qty)):i.cost;DB.update('products',i.pid,{stock:DB.inc(i.qty),cost:nc})}
  const sup=doc.supplierId&&DB.get('suppliers',doc.supplierId);if(sup&&num(doc.total)-num(doc.paid)>0)DB.update('suppliers',sup.id,{balance:DB.inc(r3(num(doc.total)-num(doc.paid)))});
}
function receivePurchase(id){
  const p=DB.get('purchases',id);const miss=(p.items||[]).filter(i=>!i.pid||!DB.get('products',i.pid));
  confirmBox(`تأكيد استلام ${esc(p.no)}؟ تُضاف الكميات للمخزون.${miss.length?`<br>أصناف غير موجودة في المخزون ولن تُضاف: ${miss.map(i=>esc(i.name)).join('، ')}`:''}`,()=>{applyPurchase(p);DB.update('purchases',id,{status:'received',receivedAt:Date.now(),day:dkey()});toast('تم الاستلام وتحديث المخزون.','ok')},'تأكيد الاستلام');
}

/* ---- العملاء والموردون (حسابات الذمم) ---- */
function partyHead(kind){const c=kind==='customers';return `<div class="hrow"><h1>${c?'العملاء والديون':'الموردون'}</h1><button class="btn pri" onclick="partyModal('${kind}')">${c?'إضافة عميل':'إضافة مورد'}</button></div><div class="filters">${field('بحث',`<input type="search" placeholder="الاسم أو الهاتف" value="${esc(S.f[kind]||'')}" oninput="S.f['${kind}']=this.value;renderBody()">`)}${field('عرض',`<select onchange="S.f['${kind}D']=this.value;renderBody()">${opts([['','الكل'],['due',c?'من عليهم ديون':'من لهم مستحقات']],S.f[kind+'D'])}</select>`)}</div>`}
function partyBody(kind){
  const c=kind==='customers',q=String(S.f[kind]||'').toLowerCase();
  const l=DB.list(kind).filter(p=>(!q||String(p.name).toLowerCase().includes(q)||String(p.phone||'').includes(q))&&(!S.f[kind+'D']||num(p.balance)>0)).sort((a,b)=>num(b.balance)-num(a.balance));
  return `<div class="stats"><div class="stat"><div class="k">${c?'عدد العملاء':'عدد الموردين'}</div><div class="v">${l.length}</div></div><div class="stat"><div class="k">${c?'إجمالي الديون لنا':'إجمالي المستحق علينا'}</div><div class="v">${money(sum(l.filter(p=>num(p.balance)>0),p=>p.balance))}</div></div></div>
  ${l.length?`<div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th class="n">الرصيد</th><th></th></tr></thead><tbody>${l.map(p=>`<tr><td>${esc(p.name)}</td><td class="num" dir="ltr" style="text-align:end">${esc(p.phone||'')}</td><td class="n">${num(p.balance)>0?`<span class="badge warn">${money(p.balance)}</span>`:money(p.balance)}</td><td><div class="acts"><button class="btn sm" onclick="statementModal('${kind}','${p.id}')">كشف حساب</button><button class="btn sm pri" onclick="payModal('${kind}','${p.id}')">${c?'قبض دفعة':'سداد دفعة'}</button><button class="btn sm" onclick="partyModal('${kind}','${p.id}')">تعديل</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="panel empty">${c?'لا يوجد عملاء. يضيفهم الموظف من نقطة البيع أو أنت من هنا.':'لا يوجد موردون بعد.'}</div>`}`;
}
HEAD.customers=()=>partyHead('customers');BODY.customers=()=>partyBody('customers');
HEAD.suppliers=()=>partyHead('suppliers');BODY.suppliers=()=>partyBody('suppliers');
function partyModal(kind,id){
  const p=id?DB.get(kind,id):{};const c=kind==='customers';
  modal(id?'تعديل':(c?'إضافة عميل':'إضافة مورد'),`${field('الاسم',`<input id="pt-name" value="${esc(p.name||'')}">`)}<div class="grid2">${field('الهاتف',`<input id="pt-phone" inputmode="tel" dir="ltr" value="${esc(p.phone||'')}">`)}${id?'':field(c?'دين سابق عليه (رصيد افتتاحي)':'مستحق سابق له (رصيد افتتاحي)',`<input id="pt-bal" inputmode="decimal" value="0">`)}</div>${field('ملاحظات',`<input id="pt-note" value="${esc(p.note||'')}">`)}`,
  `<button class="btn pri" onclick="saveParty('${kind}','${id||''}')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button>${id&&!num(p.balance)?`<button class="btn danger" style="margin-inline-start:auto" onclick="confirmBox('حذف نهائياً؟',()=>{DB.del('${kind}','${id}');toast('تم الحذف.')},'حذف')">حذف</button>`:''}`);
}
function saveParty(kind,id){const name=val('pt-name');if(!name)return toast('اكتب الاسم.','err');const d={name,phone:val('pt-phone'),note:val('pt-note')};if(id)DB.update(kind,id,d);else DB.add(kind,{...d,balance:r3(num(val('pt-bal'))),createdAt:Date.now()});closeModal();toast('تم الحفظ.','ok')}
function payModal(kind,id){
  const p=DB.get(kind,id),c=kind==='customers';
  modal(`${c?'قبض دفعة من':'سداد دفعة إلى'} ${p.name}`,`<div class="note">الرصيد الحالي: <b>${money(p.balance)} ${esc(cur())}</b></div><div class="grid2">${field('المبلغ',`<input id="py-a" inputmode="decimal" value="${num(p.balance)>0?r3(p.balance):''}">`)}${field('الطريقة',`<select id="py-m">${opts([['cash','نقدي'],['transfer','تحويل'],['card','بطاقة'],['cheque','شيك']])}</select>`)}</div>${field('ملاحظة',`<input id="py-n">`)}`,
  `<button class="btn pri" onclick="doPay('${kind}','${id}')">حفظ الدفعة</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function doPay(kind,id){
  const a=r3(num(val('py-a')));if(a<=0)return toast('أدخل مبلغاً صحيحاً.','err');const p=DB.get(kind,id);
  DB.add('payments',{type:kind==='customers'?'in':'out',partyType:kind,partyId:id,partyName:p.name,amount:a,method:val('py-m'),note:val('py-n'),date:Date.now(),day:dkey(),by:S.profile.name||S.profile.username});
  DB.update(kind,id,{balance:DB.inc(-a)});closeModal();toast('تم تسجيل الدفعة.','ok');
}
function statementModal(kind,id){
  const p=DB.get(kind,id),c=kind==='customers';
  const ev=[];
  if(c)DB.list('invoices').filter(v=>v.customerId===id&&v.docType==='invoice'&&!v.cancelled).forEach(v=>ev.push({date:num(v.createdAt)||Date.parse(v.day),d:`${docLabel(v)} ${v.number}`,debit:r3(num(v.total)-num(v.paid)),info:money(v.total)}));
  if(c)DB.list('sales').filter(s=>s.customerId===id).forEach(s=>ev.push({date:s.date,d:`فاتورة ${s.no}${s.status==='returned'?' (مرتجعة)':''}`,debit:s.status==='returned'?0:num(s.due),info:money(s.total)}));
  else DB.list('purchases').filter(s=>s.supplierId===id).forEach(s=>ev.push({date:s.date,d:`شراء ${s.no}`,debit:r3(num(s.total)-num(s.paid)),info:money(s.total)}));
  DB.list('payments').filter(x=>x.partyId===id).forEach(x=>ev.push({date:x.date,d:`دفعة ${x.note?'('+x.note+')':''}`,credit:num(x.amount)}));
  ev.sort((a,b)=>a.date-b.date);
  modal(`كشف حساب: ${p.name}`,`${ev.length?`<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="n">قيمة الفاتورة</th><th class="n">${c?'آجل عليه':'آجل له'}</th><th class="n">مدفوع</th></tr></thead><tbody>${ev.map(e=>`<tr><td class="num">${fdt(e.date)}</td><td>${esc(e.d)}</td><td class="n">${e.info||''}</td><td class="n">${e.debit?money(e.debit):''}</td><td class="n">${e.credit?money(e.credit):''}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">الرصيد الحالي (يشمل الرصيد الافتتاحي)</td><td class="n">${money(p.balance)}</td></tr></tfoot></table></div>`:'<div class="empty sm">لا توجد حركات.</div>'}`,
  `${c&&p.phone?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${String(p.phone).replace(/\D/g,'').replace(/^(\d{8})$/,'968$1')}?text=${encodeURIComponent(`${SET().companyName}\nعزيزنا ${p.name}، رصيد حسابكم المستحق: ${money(p.balance)} ${cur()}.\nشكراً لكم.`)}">تذكير واتساب</a>`:''}<button class="btn" onclick="closeModal()">إغلاق</button>`,true);
}

BODY.expenses=()=>{
  const m=S.f.em||mkey(),all=DB.list('expenses').filter(e=>String(e.day).startsWith(m)),l=all.filter(e=>!S.f.et||(e.type||'company')===S.f.et).sort((a,b)=>b.date-a.date);

};
function expenseModal(){
  modal('تسجيل مصروف',`<div class="grid3">${field('التاريخ',`<input id="ex-d" type="date" value="${dkey()}">`)}${field('النوع',`<select id="ex-t" onchange="$('#ex-c').innerHTML=opts(expCats(this.value))">${opts(Object.entries(EXP_TYPES))}</select>`)}${field('البند',`<select id="ex-c">${opts(expCats('company'))}</select>`)}</div><div class="grid2">${field('المبلغ',`<input id="ex-a" inputmode="decimal">`)}${field('طريقة الدفع',`<select id="ex-m">${opts([['cash','نقدي'],['transfer','تحويل'],['card','بطاقة']])}</select>`)}</div>${field('البيان',`<input id="ex-n" placeholder="مثال: فاتورة كهرباء المحل">`)}`,
  `<button class="btn pri" onclick="saveExpense()">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function saveExpense(){const a=r3(num(val('ex-a')));if(a<=0)return toast('أدخل المبلغ.','err');DB.add('expenses',{day:val('ex-d')||dkey(),date:Date.now(),type:val('ex-t')||'company',category:val('ex-c'),amount:a,method:val('ex-m'),note:val('ex-n'),by:S.profile.name||S.profile.username});closeModal();toast('تم تسجيل المصروف.','ok')}

/* ---- التقارير والتحليل ---- */
function reportRange(){
  const p=S.f.rp||'month',t=new Date();
  if(p==='today')return [dkey(),dkey(),'اليوم'];
  if(p==='week')return [dkey(daysAgo(6)),dkey(),'آخر 7 أيام'];
  if(p==='month')return [...monthRange(),'الشهر الحالي'];
  if(p==='lastmonth'){const d=new Date(t.getFullYear(),t.getMonth()-1,1);return [...monthRange(mkey(d)),'الشهر الماضي']}
  if(p==='year')return [`${t.getFullYear()}-01-01`,`${t.getFullYear()}-12-31`,`سنة ${t.getFullYear()}`];
  return [S.f.rf||dkey(),S.f.rt||dkey(),'فترة مخصصة'];
}
HEAD.reports=()=>`<div class="hrow"><h1>التقارير والتحليل</h1><div style="display:flex;gap:.5rem"><button class="btn" onclick="exportReport()">تصدير CSV</button><button class="btn pri" onclick="printReport()">طباعة</button></div></div>
<div class="filters">${field('الفترة',`<select onchange="S.f.rp=this.value;renderHead();renderBody()">${opts([['today','اليوم'],['week','آخر 7 أيام'],['month','الشهر الحالي'],['lastmonth','الشهر الماضي'],['year','السنة الحالية'],['custom','فترة مخصصة']],S.f.rp||'month')}</select>`)}${S.f.rp==='custom'?field('من',`<input type="date" value="${S.f.rf||dkey()}" onchange="S.f.rf=this.value;renderBody()">`)+field('إلى',`<input type="date" value="${S.f.rt||dkey()}" onchange="S.f.rt=this.value;renderBody()">`):''}</div>`;
BODY.reports=()=>{
  const [a,b,label]=reportRange(),r=calc(a,b);
  const prods=Object.values(r.byProduct).sort((x,y)=>y.rev-x.rev);
  const byProfit=[...prods].sort((x,y)=>y.profit-x.profit);
  const days=Object.entries(r.byDay).sort((x,y)=>x[0]<y[0]?1:-1);
  const avg=r.count?r.sales/r.count:0;
  const tbl=(h,rows,foot)=>`<div class="tbl-wrap"><table><thead><tr>${h.map((x,i)=>`<th class="${i?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${h.length}" class="empty sm">لا توجد بيانات.</td></tr>`}</tbody>${foot||''}</table></div>`;
  const tr=(c)=>`<tr>${c.map((x,i)=>`<td class="${i?'n':''}">${x}</td>`).join('')}</tr>`;
  return `<div class="cols"><div class="panel"><h2>الأرباح والخسائر: ${label} <small class="num">(${a} إلى ${b})</small></h2><table class="ledger">
    <tr><td>إجمالي المبيعات</td><td>${money(r.sales)}</td></tr>
    ${r.vat?`<tr class="sub"><td>ضريبة القيمة المضافة المحصّلة (مستحقة للدولة)</td><td>${money(r.vat)}</td></tr>`:''}
    <tr><td>صافي الإيراد</td><td>${money(r.revenue)}</td></tr>
    <tr class="sub"><td>تكلفة البضاعة المباعة</td><td>${money(r.cost)}</td></tr>
    <tr><td>مجمل الربح (هامش ${r.margin.toFixed(1)}%)</td><td>${money(r.gross)}</td></tr>
    <tr class="sub"><td>مصروفات الشركة</td><td>${money(r.expCompany)}</td></tr>
    ${r.expHome?`<tr class="sub"><td>مصروفات المنزل</td><td>${money(r.expHome)}</td></tr>`:''}
    <tr class="tot"><td>صافي الربح</td><td class="${r.netProfit<0?'neg-v':''}">${money(r.netProfit)}</td></tr></table></div>
  <div class="panel"><h2>مؤشرات</h2><div class="stats" style="grid-template-columns:1fr 1fr">
    <div class="stat"><div class="k">فواتير (نقطة البيع ${r.posCount} + الإدارة ${r.invCount})</div><div class="v">${r.count}</div></div><div class="stat"><div class="k">متوسط الفاتورة</div><div class="v">${money(avg)}</div></div>
    <div class="stat"><div class="k">الخصومات الممنوحة</div><div class="v">${money(r.disc)}</div></div><div class="stat"><div class="k">المرتجعات (${r.retCount})</div><div class="v">${money(r.retTotal)}</div></div>
    <div class="stat"><div class="k">مبيعات آجلة</div><div class="v">${money(r.due)}</div></div><div class="stat"><div class="k">ضريبة محصّلة</div><div class="v">${money(r.vat)}</div></div></div></div></div>
  <div class="cols"><div><h2>حسب طريقة الدفع</h2>${tbl(['الطريقة','المبلغ','النسبة'],Object.entries(r.byMethod).map(([k,v])=>tr([METHODS[k]||k,money(v),(r.sales?v/r.sales*100:0).toFixed(1)+'%'])))}</div>
  <div><h2>أداء الموظفين</h2>${tbl(['الموظف','الفواتير','المبيعات','الربح'],Object.values(r.byCashier).sort((x,y)=>y.total-x.total).map(c=>tr([esc(c.name),c.count,money(c.total),money(c.profit)])))}</div></div>
  <div class="cols"><div><h2>الأكثر مبيعاً</h2>${tbl(['الصنف','الكمية','الإيراد','الربح'],prods.slice(0,15).map(p=>tr([esc(p.name),p.qty,money(p.rev),money(p.profit)])))}</div>
  <div><h2>الأعلى ربحاً (منتجات وخدمات)</h2>${tbl(['الصنف','النوع','الربح','الهامش'],byProfit.slice(0,15).map(p=>tr([esc(p.name),p.service?'خدمة':'منتج',money(p.profit),(p.rev?p.profit/p.rev*100:0).toFixed(0)+'%'])))}</div></div>
  <div class="cols"><div><h2>حسب التصنيف</h2>${tbl(['التصنيف','الكمية','الإيراد','الربح'],Object.entries(r.byCat).sort((x,y)=>y[1].rev-x[1].rev).map(([k,c])=>tr([esc(k),c.qty,money(c.rev),money(c.profit)])))}</div>
  <div><h2>المصروفات حسب البند</h2>${tbl(['البند','المبلغ'],Object.entries(r.byExp).sort((x,y)=>y[1]-x[1]).map(([k,v])=>tr([esc(k),money(v)])))}</div></div>
  <div><h2>الحركة اليومية</h2>${tbl(['اليوم','الفواتير','المبيعات','الربح الإجمالي'],days.map(([d,x])=>tr([d,x.count,money(x.total),money(x.profit)])),days.length?`<tfoot>${tr(['المجموع',r.count,money(r.sales),money(r.gross)])}</tfoot>`:'')}</div>`;
};
function printReport(){printHTML(`<div class="rcpt a4" dir="rtl"><h4>${esc(SET().companyName)}</h4>${$('#sec-body').innerHTML}</div>`)}
function exportReport(){const [a,b]=reportRange(),r=calc(a,b);const rows=[['تقرير',a,b],[],['صافي المبيعات',r.sales],['الضريبة',r.vat],['التكلفة',r.cost],['مجمل الربح',r.gross],['المصروفات',r.expenses],['صافي الربح',r.netProfit],[],['اليوم','الفواتير','المبيعات','الربح']];Object.entries(r.byDay).sort().forEach(([d,x])=>rows.push([d,x.count,r3(x.total),r3(x.profit)]));rows.push([],['الصنف','الكمية','الإيراد','الربح']);Object.values(r.byProduct).sort((x,y)=>y.rev-x.rev).forEach(p=>rows.push([p.name,p.qty,r3(p.rev),r3(p.profit)]));download(`report_${a}_${b}.csv`,csv(rows))}

/* ---- الورديات ---- */
HEAD.shifts=()=>`<h1>الورديات ومطابقة النقد</h1><div class="note">يرى الموظف فقط النقد الذي سلّمه. النقد المتوقع والفرق يظهران هنا لك وحدك، ويُحسبان من الفواتير المسجلة وقت العرض.</div><div class="filters">${field('الشهر',`<input type="month" value="${S.f.shm||mkey()}" onchange="S.f.shm=this.value;renderBody()">`)}</div>`;
const shiftView=s=>{const x=shiftStats(s),open=s.status==='open',diff=open?null:r3(num(s.countedCash)-x.expected);return {...s,...x,expectedCash:x.expected,salesTotal:r3(x.total),salesCount:x.count,byMethod:x.by,diff:open?null:diff}};
const diffBadge=d=>d==null?'<span class="badge ok">مفتوحة الآن</span>':d<-0.0005?`<span class="badge bad">عجز ${money(-d)}</span>`:d>0.0005?`<span class="badge warn">زيادة ${money(d)}</span>`:'<span class="badge ok">مطابق</span>';
BODY.shifts=()=>{
  const m=S.f.shm||mkey(),l=DB.list('shifts').filter(s=>String(s.day).startsWith(m)||s.status==='open').sort((a,b)=>b.openedAt-a.openedAt).map(shiftView);
  const short=l.filter(s=>s.diff!=null&&s.diff<-0.0005);
  return `<div class="stats"><div class="stat"><div class="k">ورديات الشهر</div><div class="v">${l.length}</div></div><div class="stat"><div class="k">ورديات فيها عجز</div><div class="v ${short.length?'neg-v':''}">${short.length}</div></div><div class="stat"><div class="k">إجمالي العجز</div><div class="v ${short.length?'neg-v':''}">${money(-sum(short,s=>s.diff))}</div></div></div>
  ${l.length?`<div class="tbl-wrap"><table><thead><tr><th>الموظف</th><th>البداية</th><th>النهاية</th><th class="n">المبيعات</th><th class="n">الفكّة</th><th class="n">النقد المتوقع</th><th class="n">المسلَّم</th><th>النتيجة</th><th></th></tr></thead><tbody>${l.map(s=>`<tr><td>${esc(s.cashierName)}</td><td class="num">${fdt(s.openedAt)}</td><td class="num">${s.closedAt?fdt(s.closedAt):'-'}</td><td class="n">${money(s.salesTotal)}</td><td class="n">${money(s.openingCash)}</td><td class="n">${money(s.expectedCash)}</td><td class="n">${s.diff==null?'-':money(s.countedCash)}</td><td>${diffBadge(s.diff)}${s.note?`<br><small>${esc(s.note)}</small>`:''}</td><td><div class="acts">${s.status==='open'?`<button class="btn sm pri" onclick="adminCloseShift('${s.id}')">إغلاق واستلام</button>`:`<button class="btn sm" onclick="printHTML(shiftHTML(shiftView(DB.get('shifts','${s.id}'))))">طباعة</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">لا توجد ورديات في هذا الشهر.</div>'}`;
};
function adminCloseShift(id){
  const sh=DB.get('shifts',id),x=shiftStats(sh);
  modal(`استلام درج ${sh.cashierName}`,`<div class="list-s"><div><span>بدأت</span><b class="num">${fdt(sh.openedAt)}</b></div><div><span>المبيعات</span><b class="num">${money(x.total)}</b></div><div><span>النقد المتوقع</span><b class="num">${money(x.expected)}</b></div></div>${field('النقد الموجود فعلاً',`<input id="ac-count" inputmode="decimal" oninput="$('#ac-diff').innerHTML=this.value===''?'':diffBadge(r3(num(this.value)-${x.expected}))">`)}<div id="ac-diff"></div>${field('ملاحظة',`<input id="ac-note" value="أغلقها المدير">`)}`,
  `<button class="btn pri" onclick="if(val('ac-count')==='')return toast('أدخل النقد الفعلي.','err');const c=r3(num(val('ac-count')));DB.update('shifts','${id}',{status:'closed',closedAt:Date.now(),salesCount:${x.count},salesTotal:${r3(x.total)},cashIn:${x.cashIn},expectedCash:${x.expected},countedCash:c,diff:r3(c-${x.expected}),note:val('ac-note'),closedBy:S.profile.name||S.profile.username});closeModal();toast('تم إغلاق الوردية.','ok')">إغلاق الوردية</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}

/* ---- الموظفون والصلاحيات ---- */

function userModal(id){
  const u=id?DB.get('users',id):{role:'cashier',maxDiscount:5,active:true};const self=id===S.profile.id;
  modal(id?'تعديل موظف':'إضافة موظف',`<div class="grid2">${field('الاسم',`<input id="us-name" value="${esc(u.name||'')}">`)}${field('اسم المستخدم (إنجليزي بدون مسافات)',`<input id="us-user" dir="ltr" autocapitalize="none" value="${esc(u.username||'')}" ${id?'disabled':''}>`)}</div>
  ${!id||DB.mode==='local'?field(id?'كلمة مرور جديدة (اتركها فارغة لعدم التغيير)':'كلمة المرور (6 أحرف على الأقل)',`<input id="us-pass" type="text" dir="ltr" autocomplete="new-password">`):'<div class="note">لتغيير كلمة مرور موظف في الوضع السحابي: يغيّرها الموظف بنفسه من زر "حسابي"، أو أوقف الحساب وأنشئ حساباً جديداً.</div>'}
  <div class="grid2">${field('الصلاحية',`<select id="us-role" ${self?'disabled':''}>${opts([['cashier','موظف مبيعات'],['admin','مدير']],u.role)}</select>`)}${field('أقصى خصم مسموح %',`<input id="us-disc" inputmode="decimal" value="${num(u.maxDiscount)}">`)}</div>
  ${self?'':`<label class="chk"><input type="checkbox" id="us-act" ${u.active!==false?'checked':''}> الحساب فعّال</label>`}`,
  `<button class="btn pri" id="us-save" onclick="saveUser('${id||''}')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
}
async function saveUser(id){
  const name=val('us-name'),username=val('us-user').toLowerCase(),pass=$('#us-pass')?val('us-pass'):'';
  const self=id===S.profile.id;
  const data={name,role:self?'admin':val('us-role'),maxDiscount:num(val('us-disc')),active:self?true:chk('us-act')};
  if(!name)return toast('اكتب اسم الموظف.','err');
  if(id){
    if(DB.mode==='local'&&pass){if(pass.length<6)return toast('كلمة المرور 6 أحرف على الأقل.','err');data.pass=await hash(pass)}
    DB.update('users',id,data);closeModal();return toast('تم الحفظ.','ok');
  }
  if(!/^[a-z0-9._-]{3,30}$/.test(username))return toast('اسم المستخدم: 3 أحرف إنجليزية أو أرقام على الأقل، بدون مسافات.','err');
  if(pass.length<6)return toast('كلمة المرور 6 أحرف على الأقل.','err');
  if(DB.list('users').some(x=>x.username===username))return toast('اسم المستخدم مستخدم مسبقاً.','err');
  const btn=$('#us-save');btn.disabled=true;btn.textContent='جارِ الإنشاء…';
  try{
    if(DB.mode==='local'){DB.add('users',{...data,username,pass:await hash(pass),createdAt:Date.now()})}
    else{
      if(!navigator.onLine)throw {code:'network'};
      const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(currentConfig(),'sec');
      await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
      const cr=await sec.auth().createUserWithEmailAndPassword(`${username}@${EMAIL_DOMAIN}`,pass);
      const uid=cr.user.uid;await sec.auth().signOut();
      DB.set('users',uid,{...data,username,createdAt:Date.now()});
    }
    closeModal();toast(`تم إنشاء حساب ${name}.`,'ok');
  }catch(e){toast(authMsg(e),'err');btn.disabled=false;btn.textContent='حفظ'}
}
