const BK_COLS=['settings','products','customers','suppliers','sales','invoices','appointments','serviceCosts','purchases','expenses','payments','shifts','stockmoves','users','counters'];
function exportBackup(){const o={app:'c7pos',version:1,at:new Date().toISOString(),data:{}};BK_COLS.forEach(c=>o.data[c]=DB.list(c).map(x=>{const y={...x};delete y.pass;return y}));download(`c7-backup-${dkey()}.json`,JSON.stringify(o),'application/json')}
function importBackup(file){
  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(e){return toast('الملف غير صالح.','err')}
    if(!o||o.app!=='c7pos')return toast('هذا ليس ملف نسخة احتياطية من البرنامج.','err');
    confirmBox('استعادة النسخة ستضيف البيانات وتستبدل السجلات التي لها نفس المعرّف. حسابات الموظفين لا تُستعاد. متابعة؟',async()=>{
      let n=0;
      for(const c of BK_COLS){if(c==='users')continue;for(const x of o.data[c]||[]){const {id,...rest}=x;if(!id)continue;DB.set(c,id,rest);n++}}
      toast(`تمت استعادة ${n} سجلاً.`,'ok');
    },'استعادة');
  };rd.readAsText(file);
}
function linkCloud(){
  modal('ربط بقاعدة البيانات السحابية',`<div class="note">نزّل نسخة احتياطية أولاً، ثم بعد الربط ادخل كمدير واستعدها من نفس المكان لنقل بياناتك إلى السحابة.</div>${field('إعدادات Firebase (firebaseConfig)',`<textarea id="cfg" rows="6" dir="ltr"></textarea>`)}`,

   مدمج من برنامج الفواتير: الفواتير وعروض الأسعار، المواعيد، حاسبة تكلفة الخدمات
   ===================================================================== */
const SVC_CATS=['أجهزة أمان','صوتيات','حاسب آلي','هواتف نقالة','تركيب عام','صيانة عامة'];
const MAINT_ST=['قيد الفحص','قيد الإصلاح','تم الإصلاح','تم التسليم','لا يمكن إصلاحه'];
const INV_ST={quote:['عرض سعر',''],paid:['مدفوعة','ok'],partial:['مدفوعة جزئياً','warn'],unpaid:['غير مدفوعة','bad'],cancelled:['ملغاة','']};
const APPT_ST={scheduled:['مجدول','warn'],done:['تم','ok'],cancelled:['ملغى','']};
const phoneKey=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('968')&&d.length===11)d=d.slice(3);return d};
const waNum=p=>{const d=phoneKey(p);return d.length===8?'968'+d:d};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const blankLine=()=>({pid:'',name:'',qty:1,price:0,cost:0});

function invTotals(v){
  const sub=r3(sum(v.items||[],i=>num(i.qty)*num(i.price)));
  const disc=Math.min(r3(num(v.discount)),sub),vat=r3((sub-disc)*num(v.vatRate)/100);
  return {sub,disc,vat,total:r3(sub-disc+vat),cost:r3(sum(v.items||[],i=>num(i.qty)*num(i.cost)))};
}
const invStatus=v=>v.docType==='quote'?'quote':v.cancelled?'cancelled':num(v.paid)>=num(v.total)-0.0005?'paid':num(v.paid)>0?'partial':'unpaid';
function docLabel(v){const c=v.categories||[];return (v.docType==='quote'?'عرض سعر':'فاتورة')+(c.includes('صيانة عامة')?' صيانة':c.includes('تركيب عام')?' تركيب':'')}
const stBadge=v=>{const s=invStatus(v);return `<span class="badge ${INV_ST[s][1]}">${INV_ST[s][0]}</span>`};

function filteredInv(){

}
BODY.invoices=()=>{

  ${field('ملاحظات',`<textarea rows="2" oninput="S.inv.notes=this.value">${esc(v.notes||'')}</textarea>`)}

/* أثر الفاتورة على المخزون ودين العميل: يُطبَّق الفرق فقط عند كل تعديل، فلا يتكرر الخصم */
function applyInvEffects(v,want){
  const had=v.stockApplied||{};
  for(const pid of new Set([...Object.keys(had),...Object.keys(want)])){const d=num(want[pid])-num(had[pid]);if(d&&DB.get('products',pid))DB.update('products',pid,{stock:DB.inc(-d)})}
  v.stockApplied=want;
  const due=v.docType==='invoice'&&!v.cancelled?r3(num(v.total)-num(v.paid)):0;
  const prevC=v.balanceCustomer||'',prev=num(v.balanceApplied);
  if(prevC&&prevC!==v.customerId){if(prev&&DB.get('customers',prevC))DB.update('customers',prevC,{balance:DB.inc(-prev)});if(due&&v.customerId)DB.update('customers',v.customerId,{balance:DB.inc(due)})}
  else{const d=r3(due-prev);if(d&&v.customerId&&DB.get('customers',v.customerId))DB.update('customers',v.customerId,{balance:DB.inc(d)})}
  v.balanceApplied=v.customerId?due:0;v.balanceCustomer=v.customerId||'';
}
function invWant(v){const w={};if(v.docType==='invoice'&&!v.cancelled)for(const l of v.items||[]){const p=l.pid&&DB.get('products',l.pid);if(p&&!p.service)w[l.pid]=(w[l.pid]||0)+num(l.qty)}return w}
async function saveInvoice(){
  if(S.busy)return;const v=S.inv,id=S.invId;
  v.items=v.items.filter(l=>String(l.name||'').trim());
  if(!v.items.length){v.items=[blankLine()];invLines();return toast('أضف بنداً واحداً على الأقل.','err')}
  v.client=String(v.client||'').trim();
  let c=v.customerId&&DB.get('customers',v.customerId);
  if(!c&&v.client){const pk=phoneKey(v.phone);c=DB.list('customers').find(x=>(pk&&phoneKey(x.phone)===pk)||x.name===v.client);if(!c){const cid=DB.add('customers',{name:v.client,phone:v.phone||'',balance:0,createdAt:Date.now()});c={id:cid}}}
  v.customerId=c?c.id:'';
  const t=invTotals(v);Object.assign(v,{subtotal:t.sub,discount:t.disc,vat:t.vat,total:t.total,cost:t.cost});
  v.paid=v.docType==='quote'?0:r3(Math.min(num(v.paid),t.total));
  if(v.docType==='invoice'&&!v.cancelled&&!v.customerId&&t.total-v.paid>0.0005)return toast('اكتب اسم العميل حتى يُسجَّل المبلغ المتبقي ديناً عليه.','err');
  const want=invWant(v),had=v.stockApplied||{};
  if(!SET().allowNegative){const short=Object.keys(want).map(pid=>{const p=DB.get('products',pid),x=want[pid]-num(had[pid]);return x>0&&x>num(p.stock)?`${p.name} (المتوفر ${num(p.stock)})`:null}).filter(Boolean);if(short.length&&!confirm('الكمية غير كافية في المخزون:\n'+short.join('\n')+'\n\nحفظ على أي حال؟'))return}
  S.busy=true;
  try{
    if(!id){const n=await DB.nextNo('invoices');v.number=n?String(n).padStart(4,'0'):Date.now().toString(36).toUpperCase();v.createdAt=Date.now();v.createdBy=S.profile.name||S.profile.username}
    applyInvEffects(v,want);v.status=invStatus(v);v.updatedAt=Date.now();
    const data=clone(v);delete data.id;
    const newId=id?DB.set('invoices',id,data):DB.add('invoices',data);
    if(v.fromSc)DB.update('serviceCosts',v.fromSc,{invoiceId:newId});
    S.invId=newId;closeModal();toast(`تم حفظ ${docLabel(v)} رقم ${v.number}.`,'ok');
  }catch(e){fail(e)}finally{S.busy=false}
}

  if(v.cancelled){v.cancelled=false;return saveInvoice()}
  confirmBox(`إلغاء الفاتورة ${esc(v.number)}؟ تعود الكميات للمخزون ويُلغى الدين المسجّل على العميل. يجب رد أي مبلغ دُفع (${money(v.paid)}).`,()=>{

function scTotals(sc){
  const parts=sum(sc.items||[],i=>num(i.qty)*num(i.cost));
  const fuel=num(sc.fuelKmPerLiter)>0?num(sc.distanceKm)/num(sc.fuelKmPerLiter)*num(sc.fuelPricePerLiter):0;
  const tech=num(sc.technicianDays)*num(sc.technicianDailyWage),mgr=num(sc.managerDays)*num(sc.managerDailyWage),asst=num(sc.assistantDays)*num(sc.assistantDailyWage);
  const labor=tech+mgr+asst,other=num(sc.otherCosts),total=parts+fuel+labor+other,price=total*(1+num(sc.marginPercent)/100);
  return {parts,fuel,tech,mgr,asst,labor,other,total:r3(total),price:r3(price),profit:r3(price-total)};
}

  modal(id?`حساب تكلفة ${sc.number||''}`:'حساب تكلفة خدمة',`<div class="grid3">${field('النوع',`<select onchange="S.sc.jobType=this.value">${opts(['تركيب','صيانة'],sc.jobType)}</select>`)}${field('التاريخ',`<input type="date" value="${esc(sc.date)}" onchange="S.sc.date=this.value">`)}${field('العميل',`<input value="${esc(sc.client||'')}" oninput="S.sc.client=this.value">`)}</div>
  <div class="grid2">${field('الهاتف',`<input dir="ltr" value="${esc(sc.phone||'')}" oninput="S.sc.phone=this.value">`)}${field('وصف العمل',`<input value="${esc(sc.description||'')}" oninput="S.sc.description=this.value">`)}</div>
  <div><h3 style="margin-bottom:.4rem">القطع والمواد</h3><datalist id="sc-prods">${DB.list('products').filter(p=>!p.service).map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist><div class="plines" id="sc-lines"></div><button class="btn" style="margin-top:.5rem" onclick="S.sc.items.push({name:'',qty:1,cost:0});scLines()">إضافة قطعة</button></div>
  <h3>الوقود</h3><div class="grid3">${nf('distanceKm','المسافة ذهاباً وإياباً (كم)')}${nf('fuelPricePerLiter','سعر لتر الوقود')}${nf('fuelKmPerLiter','استهلاك السيارة (كم/لتر)')}</div>
  <h3>أجور الفريق</h3><div class="grid3">${nf('technicianDays','أيام الفني')}${nf('managerDays','أيام المدير')}${nf('assistantDays','أيام المساعد')}${nf('technicianDailyWage','أجر الفني اليومي')}${nf('managerDailyWage','أجر المدير اليومي')}${nf('assistantDailyWage','أجر المساعد اليومي')}</div>
  <div class="grid2">${nf('otherCosts','تكاليف أخرى')}${nf('marginPercent','هامش الربح %')}</div>
  <div id="sc-sum" class="list-s"></div>`,
  `<button class="btn pri" onclick="saveSc()">حفظ</button><button class="btn amber" onclick="scToQuote()">إنشاء عرض سعر بالسعر المقترح</button>${id?`<button class="btn danger" style="margin-inline-start:auto" onclick="confirmBox('حذف هذا الحساب؟',()=>DB.del('serviceCosts','${id}'),'حذف')">حذف</button>`:''}`,true);
  scLines();
}
function scLines(){const el=$('#sc-lines');if(!el)return;el.innerHTML=S.sc.items.map((l,i)=>`<div class="pl">${field(i?'':'القطعة',`<input list="sc-prods" value="${esc(l.name||'')}" oninput="S.sc.items[${i}].name=this.value" onchange="const p=DB.list('products').find(x=>x.name===this.value.trim());if(p){S.sc.items[${i}].cost=num(p.cost);scLines()}">`)}${field(i?'':'الكمية',`<input inputmode="decimal" value="${l.qty}" oninput="S.sc.items[${i}].qty=num(this.value);scSum()">`)}${field(i?'':'تكلفة الوحدة',`<input inputmode="decimal" value="${l.cost}" oninput="S.sc.items[${i}].cost=num(this.value);scSum()">`)}<button class="btn sm" onclick="S.sc.items.splice(${i},1);scLines()" aria-label="حذف">×</button></div>`).join('');scSum()}
function scSum(){const e=$('#sc-sum');if(!e)return;const t=scTotals(S.sc);e.innerHTML=[['القطع والمواد',t.parts],['الوقود',t.fuel],['أجور الفريق',t.labor],['تكاليف أخرى',t.other]].map(([k,x])=>`<div><span>${k}</span><b class="num">${money(x)}</b></div>`).join('')+`<div><span>إجمالي التكلفة (بدون خسارة)</span><b class="num">${money(t.total)}</b></div><div><span>السعر المقترح للعميل</span><b class="num pos-v">${money(t.price)} ${esc(cur())}</b></div><div><span>الربح المتوقع</span><b class="num">${money(t.profit)}</b></div>`}
async function saveSc(silent){
  const sc=S.sc;sc.items=(sc.items||[]).filter(i=>String(i.name||'').trim()||num(i.cost));
  if(!S.scId){const n=await DB.nextNo('serviceCosts');sc.number=n?String(n).padStart(4,'0'):'';sc.createdAt=Date.now()}
  const d=clone(sc);delete d.id;S.scId=S.scId?DB.set('serviceCosts',S.scId,d):DB.add('serviceCosts',d);
  if(!silent){closeModal();toast('تم حفظ الحساب.','ok')}
  return S.scId;
}
async function scToQuote(){
  const scId=await saveSc(true),sc=S.sc,t=scTotals(sc);
  invEditor(null,'quote',{client:sc.client||'',phone:sc.phone||'',categories:[sc.jobType==='صيانة'?'صيانة عامة':'تركيب عام'],items:[{pid:'',name:`${sc.jobType}${sc.description?': '+sc.description:''}`,qty:1,price:t.price,cost:t.total}],fromSc:scId});
}

/* ---- استيراد بيانات برنامج الفواتير القديم ---- */
function oldMethod(t,paid){t=String(t||'');if(/نقد|كاش/.test(t))return 'cash';if(/تحويل|بنك/.test(t))return 'transfer';if(/بطاق|شبك|فيزا|ماستر/.test(t))return 'card';return paid?'cash':'credit'}
function importOld(file){
  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{
    let o;try{o=JSON.parse(rd.result)}catch(e){return toast('الملف غير صالح.','err')}
    if(!o||!Array.isArray(o.invoices)&&!Array.isArray(o.products))return toast('هذا ليس ملف نسخة احتياطية من برنامج الفواتير.','err');
    const cnt=k=>(o[k]||[]).length;
    confirmBox(`سيتم نقل: ${cnt('invoices')} فاتورة/عرض، ${cnt('products')} صنف، ${cnt('appointments')} موعد، ${cnt('expenses')} مصروف، ${cnt('purchaseOrders')} طلب توريد، ${cnt('serviceCosts')} حساب تكلفة، مع ديون العملاء والموردين.${SET().importedOldAt?'<br><b>تنبيه: تم الاستيراد سابقاً، وتكراره قد يضاعف الديون.</b>':''}`,()=>runImportOld(o),'بدء النقل');
  };rd.readAsText(file,'utf-8');
}
function runImportOld(o){
  const os=o.settings||{},vatRate=os.vatEnabled===false?0:num(os.vatRate);
  const lc=s=>String(s||'').trim().toLowerCase();
  // الأصناف
  const pmap={},byName={};DB.list('products').forEach(p=>byName[lc(p.name)]=p.id);
  let np=0;
  for(const p of o.products||[]){if(!String(p.name||'').trim())continue;const ex=byName[lc(p.name)];if(ex){pmap[p.id]=ex;continue}
    const id=p.id||DB.newId('products');DB.set('products',id,{name:String(p.name).trim(),unit:p.unit||'حبة',cost:r3(num(p.costPrice)),price:r3(num(p.salePrice)),stock:num(p.qty),minStock:num(p.minQty),category:'',barcode:'',service:false,active:true,createdAt:Date.now()});pmap[p.id]=id;byName[lc(p.name)]=id;np++}
  // العملاء والموردون
  const cmap={};DB.list('customers').forEach(c=>{cmap[phoneKey(c.phone)||'n:'+lc(c.name)]=c.id});
  const cust=(name,phone)=>{name=String(name||'').trim();if(!name)return '';const k=phoneKey(phone)||'n:'+lc(name);if(cmap[k])return cmap[k];const id=DB.add('customers',{name,phone:phone||'',balance:0,createdAt:Date.now()});cmap[k]=id;return id};
  const smap={};DB.list('suppliers').forEach(s=>smap[lc(s.name)]=s.id);
  const supp=name=>{name=String(name||'').trim();if(!name)return '';if(smap[lc(name)])return smap[lc(name)];const id=DB.add('suppliers',{name,phone:'',balance:0,createdAt:Date.now()});smap[lc(name)]=id;return id};
  // دفعات مرتبطة بفواتير
  const recByInv={};for(const r of o.receivables||[])if(r.invoiceId)recByInv[r.invoiceId]=r;
  const ids=new Set((o.invoices||[]).map(v=>v.id));
  let maxNo=Math.max(0,...DB.list('invoices').map(v=>parseInt(v.number)||0));let ni=0;
  for(const v of o.invoices||[]){
    const items=(v.items||[]).filter(i=>String(i.desc||'').trim()).map(i=>{const pid=byName[lc(i.desc)]||'';const p=pid&&DB.get('products',pid);return {pid,name:String(i.desc).trim(),qty:num(i.qty),price:r3(num(i.price)),cost:p?num(p.cost):0}});
    const d={docType:v.docType==='quote'?'quote':'invoice',number:String(v.number||''),day:v.date||dkey(),dueDate:v.dueDate||'',client:v.client||'',phone:v.phone||'',address:v.address||'',categories:v.categories||[],items,discount:r3(num(v.discount)),vatRate,notes:v.notes||'',maintenance:v.maintenance||{},method:oldMethod(v.paymentMethod,v.status==='paid'),createdAt:Date.parse(v.date)||Date.now(),createdBy:'برنامج الفواتير'};
    const t=invTotals(d);Object.assign(d,{subtotal:t.sub,vat:t.vat,total:t.total,cost:t.cost});
    d.customerId=cust(d.client,d.phone);
    const rec=recByInv[v.id];d.paid=d.docType==='quote'?0:v.status==='paid'?t.total:rec?r3(Math.min(num(rec.paidAmount),t.total)):0;
    const sa={};for(const [pid,q] of Object.entries(v.stockApplied||{}))if(pmap[pid])sa[pmap[pid]]=(sa[pmap[pid]]||0)+num(q);
    d.stockApplied=d.docType==='invoice'?sa:{};
    const due=d.docType==='invoice'?r3(t.total-d.paid):0;
    if(due>0&&d.customerId)DB.update('customers',d.customerId,{balance:DB.inc(due)});
    d.balanceApplied=d.customerId?due:0;d.balanceCustomer=d.customerId||'';d.status=invStatus(d);
    DB.set('invoices',v.id||DB.newId('invoices'),d);maxNo=Math.max(maxNo,parseInt(v.number)||0);ni++;
  }
  // ديون عملاء غير مرتبطة بفاتورة
  for(const r of o.receivables||[]){if(r.invoiceId&&ids.has(r.invoiceId))continue;const rem=r3(num(r.amount)-num(r.paidAmount));if(rem>0&&r.status!=='paid'){const id=cust(r.client,r.phone);if(id)DB.update('customers',id,{balance:DB.inc(rem)})}}
  // ديون الشركات (الموردون)
  for(const d of o.debts||[]){const rem=r3(num(d.amount)-num(d.paidAmount));if(rem>0&&d.status!=='paid'){const id=supp(d.supplier);if(id)DB.update('suppliers',id,{balance:DB.inc(rem)})}}
  // طلبات التوريد
  for(const po of o.purchaseOrders||[]){const items=(po.items||[]).filter(i=>String(i.desc||'').trim()).map(i=>({pid:byName[lc(i.desc)]||'',name:String(i.desc).trim(),qty:num(i.qty),cost:r3(num(i.cost))}));const total=r3(sum(items,i=>i.qty*i.cost)),sid=supp(po.supplier);
    DB.set('purchases',po.id||DB.newId('purchases'),{no:'PO-'+(po.number||''),date:Date.parse(po.date)||Date.now(),day:po.date||dkey(),supplierId:sid,supplierName:String(po.supplier||'').trim(),items,total,paid:total,status:po.status==='received'?'received':'pending',note:po.notes||'',by:'برنامج الفواتير'})}
  // المصروفات
  for(const e of o.expenses||[])DB.set('expenses',e.id||DB.newId('expenses'),{day:e.date||dkey(),date:Date.parse(e.date)||Date.now(),type:e.type==='home'?'home':'company',category:e.category||'أخرى',amount:r3(num(e.amount)),method:oldMethod(e.paymentMethod,true),note:[e.description,e.notes].filter(Boolean).join(' - '),by:'برنامج الفواتير'});
  // حسابات التكلفة والمواعيد
  for(const sc of o.serviceCosts||[]){const d=clone(sc);delete d.id;d.items=(sc.items||[]).map(i=>({name:i.desc||'',qty:num(i.qty),cost:num(i.cost)}));DB.set('serviceCosts',sc.id||DB.newId('serviceCosts'),d)}
  for(const a of o.appointments||[]){const d=clone(a);delete d.id;DB.set('appointments',a.id||DB.newId('appointments'),d)}
  if(maxNo)DB.set('counters','invoices',{n:maxNo});
  const mx=(arr,f)=>Math.max(0,...(arr||[]).map(x=>parseInt(f(x))||0));
  const scN=Math.max(mx(o.serviceCosts,x=>x.number),mx(DB.list('serviceCosts'),x=>x.number));if(scN)DB.set('counters','serviceCosts',{n:scN});
  const poN=Math.max(mx(o.purchaseOrders,x=>x.number),mx(DB.list('purchases'),x=>String(x.no||'').replace(/\D/g,'')));if(poN)DB.set('counters','purchases',{n:poN});
  DB.update('settings','main',{...(o.bizName?{companyName:o.bizName}:{}),...(o.bizTagline?{tagline:o.bizTagline}:{}),...(o.bizPhone?{phone:o.bizPhone}:{}),...(os.stampNameAr?{legalName:os.stampNameAr}:{}),...(os.stampNameEn?{legalNameEn:os.stampNameEn}:{}),...(os.stampCr?{cr:os.stampCr}:{}),...(os.stampCountry?{country:os.stampCountry}:{}),fuelPrice:num(os.fuelPricePerLiter)||0.19,fuelKm:num(os.fuelKmPerLiter)||12,wTech:num(os.technicianDailyWage),wMgr:num(os.managerDailyWage),wAsst:num(os.assistantDailyWage),margin:num(os.marginPercent)||30,importedOldAt:Date.now()});
  toast(`تم النقل: ${ni} فاتورة/عرض و ${np} صنف جديد.`,'ok');
  S._stDirty=false;setTimeout(()=>{if(S.view==='admin'){renderHead();renderBody()}},400);
}

boot();
</script>
